<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfólio | Croma</title><link rel="stylesheet" href="/css/interno-base.css?v=20260822-1"><style>.shell{max-width:1240px;margin:auto;padding:28px 18px 80px}.grid{display:grid;grid-template-columns:410px 1fr;gap:16px}.card{background:#fff;border:1px solid var(--croma-line);border-radius:18px;padding:18px}.field{display:grid;gap:6px;margin-bottom:11px}.field label{font-size:.72rem;font-weight:900;text-transform:uppercase;color:var(--croma-purple)}input,select,textarea{padding:10px 11px;border:1px solid #d8d6e4;border-radius:10px;font:inherit}.check{display:flex;gap:7px;align-items:center;margin:8px 0}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer;background:var(--croma-purple);color:#fff}.btn.light{background:#fff;color:var(--croma-purple);border:1px solid var(--croma-line)}.btn.bad{background:#fff;color:#a63838;border:1px solid #edcccc}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{width:100%;box-sizing:border-box;margin-bottom:12px}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{border:1px solid #e7e4ef;border-radius:14px;overflow:hidden}.item img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}.body{padding:12px}.name{font-weight:900;color:var(--croma-deep)}.muted{color:var(--croma-muted);font-size:.82rem}.preview{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#eceaf3;margin-bottom:12px}.status{min-height:22px;font-weight:800}.status.ok{color:#537b23}.status.bad{color:#a63838}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.list{grid-template-columns:1fr}}</style></head><body hidden><header class="internal-header"><a href="../">← Croma Interno</a><strong>Portfólio</strong></header><main class="shell"><span class="internal-eyebrow">Mídia pública</span><h1 class="internal-title">Portfólio</h1><p class="internal-lead">Use fotos reais de trabalhos da Croma. Enquanto o acervo é atualizado, imagens de referência ficam identificadas publicamente para não serem confundidas com trabalhos executados.</p><div class="grid"><section class="card"><h2 id="formTitle">Novo item</h2><img id="preview" class="preview" alt="Prévia"><div class="field"><label>Título</label><input id="title"></div><div class="field"><label>Slug</label><input id="slug"></div><div class="field"><label>Descrição</label><textarea id="description" rows="3"></textarea></div><div class="field"><label>Foto / URL</label><input id="imageUrl" type="url"></div><div class="field"><label>Texto alternativo</label><input id="imageAlt"></div><div class="field"><label>Origem</label><select id="sourceType"><option value="propria">Foto própria</option><option value="fornecedor">Fornecedor</option><option value="stock">Banco de imagens</option><option value="gerada">Gerada</option></select></div><div class="field"><label>Crédito</label><input id="credit"></div><div class="field"><label>URL da fonte</label><input id="sourceUrl" type="url"></div><div class="field"><label>Ordem</label><input id="sortOrder" type="number" value="0"></div><label class="check"><input id="reference" type="checkbox"> Imagem de referência (não é trabalho real da Croma)</label><label class="check"><input id="featured" type="checkbox"> Destaque na Home</label><label class="check"><input id="active" type="checkbox" checked> Ativo</label><p class="status" id="status"></p><div class="actions"><button class="btn" id="save">Salvar</button><button class="btn light" id="newBtn">Novo</button><button class="btn bad" id="del" style="display:none">Excluir</button></div></section><section class="card"><h2>Itens do portfólio</h2><input id="search" class="search" placeholder="Buscar por título"><div id="list" class="list"></div></section></div></main><script type="module">import{supabase}from'/js/croma-supabase.js?v=20260831-2';import{protectInternalPage}from'/js/interno-auth.js?v=20260822-2';const session=await protectInternalPage({roles:['owner','manager']});if(!session)throw new Error('auth');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const FALLBACK='https://images.pexels.com/photos/8490095/pexels-photo-8490095.jpeg?auto=compress&cs=tinysrgb&w=1200';let rows=[],editing=null;const slugify=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');function updatePreview(){preview.src=imageUrl.value.trim()||FALLBACK;preview.alt=imageAlt.value.trim()||title.value.trim()||'Prévia'}function render(){const q=search.value.trim().toLowerCase();const data=rows.filter(x=>!q||[x.title,x.slug,x.description].some(v=>String(v||'').toLowerCase().includes(q)));list.innerHTML=data.map(x=>`<article class="item"><img src="${esc(x.image_url)}" alt="${esc(x.image_alt||x.title)}" loading="lazy"><div class="body"><div class="name">${esc(x.title)}</div><div class="muted">${x.is_reference?'Imagem de referência':'Trabalho real'} · ${x.active?'ativo':'inativo'}</div><div style="margin-top:9px"><button class="btn light" data-edit="${x.id}">Editar</button></div></div></article>`).join('')||'<p class="muted">Nenhum item encontrado.</p>'}async function load(){const r=await supabase.from('portfolio_items').select('*').order('sort_order').order('title');if(r.error)throw r.error;rows=r.data||[];render()}function reset(){editing=null;formTitle.textContent='Novo item';title.value=slug.value=description.value=imageUrl.value=imageAlt.value=credit.value=sourceUrl.value='';sourceType.value='propria';sortOrder.value='0';reference.checked=false;featured.checked=false;active.checked=true;del.style.display='none';status.textContent='';updatePreview()}function edit(id){editing=rows.find(x=>x.id===id);if(!editing)return;formTitle.textContent='Editar item';title.value=editing.title||'';slug.value=editing.slug||'';description.value=editing.description||'';imageUrl.value=editing.image_url||'';imageAlt.value=editing.image_alt||'';sourceType.value=editing.image_source_type||'propria';credit.value=editing.image_credit||'';sourceUrl.value=editing.image_source_url||'';sortOrder.value=editing.sort_order||0;reference.checked=!!editing.is_reference;featured.checked=!!editing.featured;active.checked=!!editing.active;del.style.display='inline-block';updatePreview();scrollTo({top:0,behavior:'smooth'})}title.oninput=()=>{if(!editing&&!slug.value)slug.value=slugify(title.value);updatePreview()};imageUrl.oninput=imageAlt.oninput=updatePreview;search.oninput=render;list.onclick=e=>{const b=e.target.closest('[data-edit]');if(b)edit(b.dataset.edit)};newBtn.onclick=reset;save.onclick=async()=>{status.className='status';status.textContent='Salvando...';try{const row={title:title.value.trim(),slug:slug.value.trim()||slugify(title.value),description:description.value.trim()||null,image_url:imageUrl.value.trim(),image_alt:imageAlt.value.trim()||null,image_source_type:sourceType.value,image_credit:credit.value.trim()||null,image_source_url:sourceUrl.value.trim()||null,is_reference:reference.checked,featured:featured.checked,active:active.checked,sort_order:Number(sortOrder.value)||0,updated_at:new Date().toISOString()};if(!row.title||!row.image_url)throw new Error('Informe título e foto.');const r=editing?await supabase.from('portfolio_items').update(row).eq('id',editing.id):await supabase.from('portfolio_items').insert(row);if(r.error)throw r.error;await load();reset();status.className='status ok';status.textContent='Item salvo.'}catch(e){status.className='status bad';status.textContent=e.message}};del.onclick=async()=>{if(!editing||!confirm('Excluir este item do portfólio?'))return;const r=await supabase.from('portfolio_items').delete().eq('id',editing.id);if(r.error){status.className='status bad';status.textContent=r.error.message;return}await load();reset()};await load();reset();</script></body></html>

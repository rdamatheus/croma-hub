<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulários | Croma</title><style>:root{--p:#30297F;--d:#211c5c;--bg:#f6f6fb;--line:#dedce8;--mut:#706d80}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#29263b}header{background:#fff;border-bottom:1px solid var(--line);padding:13px 4vw;display:flex;justify-content:space-between}header a{color:var(--p);font-weight:900;text-decoration:none}.shell{max-width:1000px;margin:auto;padding:30px 18px 70px}h1{color:var(--d);font-size:clamp(2rem,5vw,3.6rem);margin:8px 0}.lead{color:var(--mut);line-height:1.55}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}.btn{border:0;background:var(--p);color:#fff;padding:10px 14px;border-radius:10px;font-weight:850;cursor:pointer}.btn.alt{background:#fff;color:var(--p);border:1px solid var(--line)}.save{font-size:.82rem;color:#537b23;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.card h2{margin-top:0;color:var(--d)}.field{margin-top:10px}.field label{display:block;font-size:.73rem;font-weight:900;color:var(--p);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #d4d1df;border-radius:9px;font:inherit}.field textarea{min-height:90px;resize:vertical}.checks{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.checks label{font-size:.88rem}.checks input{accent-color:var(--p)}@media(max-width:700px){.grid{grid-template-columns:1fr}}@media print{header,.toolbar,.lead{display:none}.shell{padding:0}.grid{grid-template-columns:1fr 1fr}.card{break-inside:avoid;border:1px solid #999;border-radius:0}}</style></head><body hidden><header><a href="../">← Painel interno</a><strong>Formulários</strong></header><main class="shell"><h1>Form

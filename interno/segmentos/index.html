<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segmentos | Croma</title><link rel="stylesheet" href="/css/interno-base.css?v=20260822-1"><style>.shell{max-width:1240px;margin:auto;padding:28px 18px 80px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs a{padding:10px 15px;border:1px solid var(--croma-line);border-radius:999px;text-decoration:none;color:var(--croma-purple);font-weight:900;background:#fff}.tabs a.active{background:var(--croma-purple);color:#fff}.grid{display:grid;grid-template-columns:390px 1fr;gap:16px}.card{background:#fff;border:1px solid var(--croma-line);border-radius:18px;padding:18px}.field{display:grid;gap:6px;margin-bottom:11px}.field label{font-size:.72rem;font-weight:900;text-transform:uppercase;color:var(--croma-purple)}input,select,textarea{padding:10px 11px;border:1px solid #d8d6e4;border-radius:10px;font:inherit}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;gap:7px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer;background:var(--croma-purple);color:#fff}.btn.light{background:#fff;color:var(--croma-purple);border:1px solid var(--croma-line)}.btn.bad{background:#fff;color:#a63838;border:1px solid #edcccc}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{width:100%;box-sizing:border-box;margin-bottom:12px}.list{display:grid;gap:10px}.item{border:1px solid #e7e4ef;border-radius:14px;padding:13px}.item-head{display:flex;justify-content:space-between;gap:12px}.name{font-weight:900;color:var(--croma-deep)}.muted{color:var(--croma-muted);font-size:.82rem}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:.72rem;padding:5px 8px;border-radius:999px;background:#f2f0f8}.status{min-height:22px;font-weight:800}.status.ok{color:#537b23}.status.bad{color:#a63838}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body hidden><header class="internal-header"><a href="../">← Croma Interno</a><strong>Segmentos</strong></header><main class="shell"><span class="internal-eyebrow">Soluções por segmento</span><h1 class="internal-title">Segmentos</h1><p class="internal-lead">Segmentos respondem para quem ou para qual ocasião o item serve. Eles podem ter subsegmentos e cada produto ou serviço pode participar de vários.</p><nav class="tabs"><a href="/interno/produtos/">Produtos</a><a href="/interno/categorias/">Categorias</a><a class="active" href="/interno/segmentos/">Segmentos</a></nav><div class="grid"><section class="card"><h2 id="formTitle">Novo segmento</h2><div class="field"><label>Nome</label><input id="nome"></div><div class="field"><label>Slug</label><input id="slug"></div><div class="field"><label>Segmento pai</label><select id="parent"><option value="">Sem segmento pai</option></select></div><div class="field"><label>Ícone</label><input id="icon" placeholder="Ex.: 🦷"></div><div class="field"><label>Descrição</label><textarea id="descricao" rows="4"></textarea></div><div class="field"><label>Imagem / URL</label><input id="imageUrl" type="url"></div><div class="field"><label>Caminho público</label><input id="publicPath" placeholder="/segmentos/"></div><div class="field"><label>Ordem na Home</label><input id="homeOrder" type="number" value="0"></div><div class="checks"><label class="check"><input id="ativo" type="checkbox" checked> Ativo</label><label class="check"><input id="featured" type="checkbox"> Destaque na Home</label></div><p class="status" id="status"></p><div class="actions"><button class="btn" id="save">Salvar segmento</button><button class="btn light" id="new">Novo</button><button class="btn bad" id="del" style="display:none">Excluir</button></div></section><section class="card"><h2>Segmentos cadastrados</h2><input class="search" id="search" placeholder="Buscar segmento ou produto"><div class="list" id="list"></div></section></div></main><script type="module">import{supabase}from'/js/croma-supabase.js?v=20260830-1';import{protectInternalPage}from'/js/interno-auth.js?v=20260822-2';const session=await protectInternalPage({roles:['owner','manager']});if(!session)throw new Error('auth');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let segments=[],products=[],links=[],editing=null;const slugify=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');function path(s){const a=[s.nome];let p=segments.find(x=>x.id===s.parent_id),g=0;while(p&&g++<8){a.unshift(p.nome);p=segments.find(x=>x.id===p.parent_id)}return a.join(' › ')}function fillParents(){parent.innerHTML='<option value="">Sem segmento pai</option>'+segments.filter(s=>s.id!==editing?.id).map(s=>`<option value="${s.id}">${esc(path(s))}</option>`).join('')}function linked(id){const ids=new Set(links.filter(l=>l.segment_id===id).map(l=>l.product_id));return products.filter(p=>ids.has(p.id))}function render(){const q=search.value.trim().toLowerCase();const rows=segments.filter(s=>{const ps=linked(s.id);return !q||[s.nome,s.slug,...ps.flatMap(p=>[p.nome,p.sku])].some(v=>String(v||'').toLowerCase().includes(q))});list.innerHTML=rows.map(s=>{const ps=linked(s.id);return`<article class="item"><div class="item-head"><div><div class="name">${esc(s.icon||'')} ${esc(path(s))}</div><div class="muted">/${esc(s.slug)} · ${s.ativo?'ativo':'inativo'} · ${ps.length} item(ns)</div></div><button class="btn light" data-edit="${s.id}">Editar</button></div>${s.descricao?`<div class="muted" style="margin-top:7px">${esc(s.descricao)}</div>`:''}<div class="chips">${ps.length?ps.map(p=>`<span class="chip">${esc(p.nome)}</span>`).join(''):'<span class="muted">Nenhum item vinculado.</span>'}</div></article>`}).join('')||'<p class="muted">Nenhum segmento encontrado.</p>'}function reset(){editing=null;formTitle.textContent='Novo segmento';nome.value=slug.value=descricao.value=imageUrl.value=publicPath.value=icon.value='';homeOrder.value='0';ativo.checked=true;featured.checked=false;del.style.display='none';fillParents();status.textContent=''}function edit(id){editing=segments.find(s=>s.id===id);if(!editing)return;formTitle.textContent='Editar segmento';nome.value=editing.nome||'';slug.value=editing.slug||'';descricao.value=editing.descricao||'';imageUrl.value=editing.image_url||'';publicPath.value=editing.public_path||'';icon.value=editing.icon||'';homeOrder.value=editing.home_order||0;ativo.checked=!!editing.ativo;featured.checked=!!editing.featured_home;fillParents();parent.value=editing.parent_id||'';del.style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}async function load(){const[s,p,l]=await Promise.all([supabase.from('catalog_segments').select('*').order('home_order').order('nome'),supabase.from('products').select('id,nome,sku').order('nome'),supabase.from('product_segments').select('*')]);if(s.error||p.error||l.error)throw s.error||p.error||l.error;segments=s.data||[];products=p.data||[];links=l.data||[];fillParents();render()}nome.addEventListener('input',()=>{if(!editing&&!slug.value)slug.value=slugify(nome.value)});search.oninput=render;list.onclick=e=>{const b=e.target.closest('[data-edit]');if(b)edit(b.dataset.edit)};new.onclick=reset;save.onclick=async()=>{status.className='status';status.textContent='Salvando...';try{const row={nome:nome.value.trim(),slug:slug.value.trim()||slugify(nome.value),parent_id:parent.value||null,descricao:descricao.value.trim()||null,image_url:imageUrl.value.trim()||null,public_path:publicPath.value.trim()||null,icon:icon.value.trim()||null,featured_home:featured.checked,home_order:Number(homeOrder.value)||0,ativo:ativo.checked,updated_at:new Date().toISOString()};if(!row.nome)throw new Error('Informe o nome.');const r=editing?await supabase.from('catalog_segments').update(row).eq('id',editing.id):await supabase.from('catalog_segments').insert(row);if(r.error)throw r.error;await load();reset();status.className='status ok';status.textContent='Segmento salvo.'}catch(e){status.className='status bad';status.textContent=e.message}};del.onclick=async()=>{if(!editing)return;const count=linked(editing.id).length;const childCount=segments.filter(s=>s.parent_id===editing.id).length;if(count||childCount){status.className='status bad';status.textContent=`Este segmento possui ${count} item(ns) e ${childCount} subsegmento(s). Remova os vínculos antes de excluir.`;return}if(!confirm('Excluir este segmento?'))return;const r=await supabase.from('catalog_segments').delete().eq('id',editing.id);if(r.error){status.className='status bad';status.textContent=r.error.message;return}await load();reset()};await load();</script></body></html>

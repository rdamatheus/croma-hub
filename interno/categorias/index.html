<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categorias | Croma</title><link rel="stylesheet" href="/css/interno-base.css?v=20260822-1"><style>
.shell{max-width:1240px;margin:auto;padding:28px 18px 80px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs a{padding:10px 15px;border:1px solid var(--croma-line);border-radius:999px;text-decoration:none;color:var(--croma-purple);font-weight:900;background:#fff}.tabs a.active{background:var(--croma-purple);color:#fff}.grid{display:grid;grid-template-columns:380px 1fr;gap:16px}.card{background:#fff;border:1px solid var(--croma-line);border-radius:18px;padding:18px}.field{display:grid;gap:6px;margin-bottom:11px}.field label{font-size:.72rem;font-weight:900;text-transform:uppercase;color:var(--croma-purple)}input,select,textarea{padding:10px 11px;border:1px solid #d8d6e4;border-radius:10px;font:inherit}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;gap:7px;align-items:center}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer;background:var(--croma-purple);color:#fff}.btn.light{background:#fff;color:var(--croma-purple);border:1px solid var(--croma-line)}.btn.bad{background:#fff;color:#a63838;border:1px solid #edcccc}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{width:100%;box-sizing:border-box;margin-bottom:12px}.list{display:grid;gap:10px}.item{border:1px solid #e7e4ef;border-radius:14px;padding:13px}.item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-weight:900;color:var(--croma-deep)}.muted{color:var(--croma-muted);font-size:.82rem}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:.72rem;padding:5px 8px;border-radius:999px;background:#f2f0f8}.status{min-height:22px;font-weight:800}.status.ok{color:#537b23}.status.bad{color:#a63838}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body hidden><header class="internal-header"><a href="../">← Croma Interno</a><strong>Categorias</strong></header><main class="shell"><span class="internal-eyebrow">Catálogo Croma</span><h1 class="internal-title">Categorias</h1><p class="internal-lead">Organize produtos e serviços em uma hierarquia única. Cada produto possui uma categoria principal.</p><nav class="tabs"><a href="/interno/produtos/">Produtos</a><a class="active" href="/interno/categorias/">Categorias</a><a href="/interno/segmentos/">Segmentos</a></nav><div class="grid"><section class="card"><h2 id="formTitle">Nova categoria</h2><div class="field"><label>Nome</label><input id="nome"></div><div class="field"><label>Slug</label><input id="slug"></div><div class="field"><label>Categoria pai</label><select id="parent"><option value="">Sem categoria pai</option></select></div><div class="field"><label>Descrição</label><textarea id="descricao" rows="3"></textarea></div><div class="field"><label>Imagem / URL</label><input id="imageUrl" type="url"></div><div class="checks"><div class="field"><label>Ordem</label><input id="ordem" type="number" value="0"></div><div class="field"><label>Ordem na Home</label><input id="homeOrder" type="number" value="0"></div></div><div class="checks"><label class="check"><input id="ativo" type="checkbox" checked> Ativa</label><label class="check"><input id="featured" type="checkbox"> Destaque na Home</label></div><p class="status" id="status"></p><div class="actions"><button class="btn" id="save">Salvar categoria</button><button class="btn light" id="new">Nova</button><button class="btn bad" id="del" style="display:none">Excluir</button></div></section><section class="card"><h2>Categorias cadastradas</h2><input class="search" id="search" placeholder="Buscar categoria ou produto"><div class="list" id="list"></div></section></div></main><script type="module">
import{supabase}from'/js/croma-supabase.js?v=20260830-1';import{protectInternalPage}from'/js/interno-auth.js?v=20260822-2';const session=await protectInternalPage({roles:['owner','manager']});if(!session)throw new Error('auth');const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let categories=[],products=[],editing=null;const slugify=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');function path(c){const a=[c.nome];let p=categories.find(x=>x.id===c.parent_id),g=0;while(p&&g++<10){a.unshift(p.nome);p=categories.find(x=>x.id===p.parent_id)}return a.join(' › ')}function fillParents(){parent.innerHTML='<option value="">Sem categoria pai</option>'+categories.filter(c=>c.id!==editing?.id).map(c=>`<option value="${c.id}">${esc(path(c))}</option>`).join('')}function render(){const q=search.value.trim().toLowerCase();const rows=categories.filter(c=>{const ps=products.filter(p=>p.catalog_category_id===c.id);return !q||[c.nome,c.slug,...ps.flatMap(p=>[p.nome,p.sku])].some(v=>String(v||'').toLowerCase().includes(q))});list.innerHTML=rows.map(c=>{const ps=products.filter(p=>p.catalog_category_id===c.id);return`<article class="item"><div class="item-head"><div><div class="name">${esc(path(c))}</div><div class="muted">/${esc(c.slug)} · ${c.ativo?'ativa':'inativa'} · ${ps.length} produto(s)</div></div><button class="btn light" data-edit="${c.id}">Editar</button></div><div class="chips">${ps.length?ps.map(p=>`<span class="chip">${esc(p.nome)}${p.sku?' · '+esc(p.sku):''}</span>`).join(''):'<span class="muted">Nenhum produto vinculado.</span>'}</div></article>`}).join('')||'<p class="muted">Nenhuma categoria encontrada.</p>'}function reset(){editing=null;formTitle.textContent='Nova categoria';nome.value=slug.value=descricao.value=imageUrl.value='';ordem.value=homeOrder.value='0';ativo.checked=true;featured.checked=false;del.style.display='none';fillParents();status.textContent=''}function edit(id){editing=categories.find(c=>c.id===id);if(!editing)return;formTitle.textContent='Editar categoria';nome.value=editing.nome||'';slug.value=editing.slug||'';descricao.value=editing.descricao||'';imageUrl.value=editing.image_url||'';ordem.value=editing.ordem||0;homeOrder.value=editing.home_order||0;ativo.checked=!!editing.ativo;featured.checked=!!editing.featured_home;fillParents();parent.value=editing.parent_id||'';del.style.display='inline-block';scrollTo({top:0,behavior:'smooth'})}async function load(){const[c,p]=await Promise.all([supabase.from('catalog_categories').select('*').order('ordem').order('nome'),supabase.from('products').select('id,nome,sku,catalog_category_id').order('nome')]);if(c.error||p.error)throw c.error||p.error;categories=c.data||[];products=p.data||[];fillParents();render()}nome.addEventListener('input',()=>{if(!editing&&!slug.value)slug.value=slugify(nome.value)});search.oninput=render;list.onclick=e=>{const b=e.target.closest('[data-edit]');if(b)edit(b.dataset.edit)};new.onclick=reset;save.onclick=async()=>{status.className='status';status.textContent='Salvando...';try{const row={nome:nome.value.trim(),slug:slug.value.trim()||slugify(nome.value),parent_id:parent.value||null,descricao:descricao.value.trim()||null,image_url:imageUrl.value.trim()||null,ordem:Number(ordem.value)||0,featured_home:featured.checked,home_order:Number(homeOrder.value)||0,ativo:ativo.checked,updated_at:new Date().toISOString()};if(!row.nome)throw new Error('Informe o nome.');let r=editing?await supabase.from('catalog_categories').update(row).eq('id',editing.id):await supabase.from('catalog_categories').insert(row);if(r.error)throw r.error;await load();reset();status.className='status ok';status.textContent='Categoria salva.'}catch(e){status.className='status bad';status.textContent=e.message}};del.onclick=async()=>{if(!editing)return;const count=products.filter(p=>p.catalog_category_id===editing.id).length;if(count){status.className='status bad';status.textContent=`Esta categoria possui ${count} produto(s). Mova-os antes de excluir.`;return}if(!confirm('Excluir esta categoria?'))return;const r=await supabase.from('catalog_categories').delete().eq('id',editing.id);if(r.error){status.className='status bad';status.textContent=r.error.message;return}await load();reset()};await load();
</script></body></html>

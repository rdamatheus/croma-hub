<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meus pedidos | Croma</title>
  <style>
    body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f5fb;color:#29263b}
    .wrap{max-width:920px;margin:40px auto;padding:22px}
    .head{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .head a{color:#30297F;text-decoration:none;font-weight:900}
    .head-actions{display:flex;gap:12px;align-items:center}
    .card{background:#fff;border:1px solid #e7e5ee;border-radius:20px;padding:20px;margin:12px 0}
    .order-card{display:block;color:inherit;text-decoration:none;transition:.15s ease;cursor:pointer}
    .order-card:hover,.order-card:focus-visible{border-color:#aaa4cf;box-shadow:0 8px 24px rgba(48,41,127,.08);transform:translateY(-1px);outline:none}
    .order{display:grid;grid-template-columns:1fr auto;gap:14px}
    .muted{color:#716d80}
    .code{font-weight:900;color:#211c5c}
    .status{display:inline-block;padding:6px 9px;border-radius:999px;background:#eeecf7;color:#30297F;font-size:.8rem;font-weight:900}
    .ok{background:#eef7e8;color:#567d25}
    .cancelled{background:#f3eeee;color:#7e5555}
    .btn{border:0;border-radius:10px;padding:9px 12px;background:#30297F;color:#fff;font-weight:900;cursor:pointer}
    .item{border-top:1px solid #eeeaf4;margin-top:14px;padding-top:12px}
    .hint{margin-top:12px;color:#30297F;font-weight:850;font-size:.9rem}
    @media(max-width:650px){.order{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.head-actions{flex-wrap:wrap}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="head">
      <a href="/">← Croma</a>
      <div class="head-actions"><a href="/minha-conta/">Minha conta</a><button class="btn" id="logout">Sair</button></div>
    </div>
    <h1>Meus pedidos</h1>
    <div id="notice"></div>
    <div id="orders"></div>
  </main>

  <script type="module">
    import {supabase,requireUser} from '/js/croma-supabase.js?v=20260821-2';

    const user=await requireUser(location.href);
    if(!user) throw new Error('auth');

    const just=new URLSearchParams(location.search).get('pedido');
    if(just){
      notice.innerHTML=`<div class="card" style="border-color:#bfd9aa"><strong>Pedido ${escapeHtml(just)} registrado.</strong><div class="muted">Você pode acompanhar o andamento e abrir os detalhes por aqui.</div></div>`;
    }

    const labels={recebido:'Recebido',em_analise:'Em análise',aguardando_pagamento:'Aguardando pagamento',pago:'Pago',em_producao:'Em produção',pronto:'Pronto',enviado:'Enviado',concluido:'Concluído',cancelado:'Cancelado'};
    const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

    const {data:list,error}=await supabase
      .from('orders')
      .select('id,order_code,status,fulfillment,payment_method,total,created_at,order_items(id,product_name,quantity,total)')
      .order('created_at',{ascending:false});

    if(error){
      orders.innerHTML='<div class="card">Não foi possível carregar seus pedidos.</div>';
    }else if(!list.length){
      orders.innerHTML='<div class="card">Você ainda não possui pedidos.</div>';
    }else{
      orders.innerHTML=list.map(o=>{
        const statusClass=['concluido','pronto','pago'].includes(o.status)?'ok':o.status==='cancelado'?'cancelled':'';
        const payment=o.payment_method==='pix'?'Pix':o.payment_method==='credito'?'Cartão de crédito':'Cartão de débito';
        const items=(o.order_items||[]).map(i=>`<div class="item"><strong>${Number(i.quantity||0)}× ${escapeHtml(i.product_name)}</strong></div>`).join('');
        const actionHint=o.status==='aguardando_pagamento'&&o.payment_method==='credito'?'Abrir para tentar o pagamento novamente ou cancelar':o.status==='recebido'?'Abrir detalhes ou cancelar pedido':'Abrir detalhes do pedido';
        return `<a class="card order-card" href="/meus-pedidos/detalhes/?id=${encodeURIComponent(o.id)}" aria-label="Abrir pedido ${escapeHtml(o.order_code)}"><div class="order"><div><div class="code">${escapeHtml(o.order_code)}</div><div class="muted">${new Date(o.created_at).toLocaleString('pt-BR')} · ${o.fulfillment==='entrega'?'Entrega':'Retirada'} · ${payment}</div></div><div><span class="status ${statusClass}">${escapeHtml(labels[o.status]||o.status)}</span><div style="margin-top:8px;font-weight:900">${brl(o.total)}</div></div></div>${items}<div class="hint">${escapeHtml(actionHint)} →</div></a>`;
      }).join('');
    }

    logout.onclick=async()=>{await supabase.auth.signOut();location.href='/';};
  </script>
</body>
</html>

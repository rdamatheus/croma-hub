<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus pedidos | Croma</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f5fb;color:#29263b}.wrap{max-width:920px;margin:40px auto;padding:22px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head a{color:#30297F;text-decoration:none;font-weight:900}.head-actions{display:flex;gap:12px;align-items:center}.card{background:#fff;border:1px solid #e7e5ee;border-radius:20px;padding:20px;margin:12px 0}.order{display:grid;grid-template-columns:1fr auto;gap:14px}.muted{color:#716d80}.code{font-weight:900;color:#211c5c}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#eeecf7;color:#30297F;font-size:.8rem;font-weight:900}.ok{background:#eef7e8;color:#567d25}.btn{border:0;border-radius:10px;padding:9px 12px;background:#30297F;color:#fff;font-weight:900;cursor:pointer}.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.files button{border:1px solid #d8d4e8;background:#fff;color:#30297F;border-radius:9px;padding:7px 10px;font-weight:850;cursor:pointer}@media(max-width:650px){.order{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.head-actions{flex-wrap:wrap}}</style></head><body><main class="wrap"><div class="head"><a href="/">← Croma</a><div class="head-actions"><a href="/minha-conta/">Minha conta</a><button class="btn" id="logout">Sair</button></div></div><h1>Meus pedidos</h1><div id="notice"></div><div id="orders"></div></main><script type="module">import{supabase,STORAGE_BUCKET,requireUser}from'/js/croma-supabase.js?v=20260821-2';const user=await requireUser(location.href);if(!user)throw new Error('auth');const just=new URLSearchParams(location.search).get('pedido');if(just)notice.innerHTML=`<div class="card" style="border-color:#bfd9aa"><strong>Pedido ${just} registrado com sucesso.</strong><div class="muted">A Croma entrará em contato pelo WhatsApp para confirmar o pedido e enviar as instruções de pagamento conforme a forma escolhida. Você pode acompanhar o andamento por aqui.</div></div>`;const labels={recebido:'Recebido',em_analise:'Em análise',aguardando_pagamento:'Aguardando pagamento',pago:'Pago',em_producao:'Em produção',pronto:'Pronto',enviado:'Enviado',concluido:'Concluído',cancelado:'Cancelado'};const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const{data:list,error}=await supabase.from('orders').select('id,order_code,status,fulfillment,payment_method,total,created_at,order_items(id,product_name,quantity,total,options),order_files(id,order_item_id,original_name,storage_path,bucket)').order('created_at',{ascending:false});if(error){orders.innerHTML='<div class="card">Não foi possível carregar seus pedidos.</div>'}else if(!list.length){orders.innerHTML='<div class="card">Você ainda não possui pedidos.</div>'}else{orders.innerHTML=list.map(o=>`<article class="card"><div class="order"><div><div class="code">${esc(o.order_code)}</div><div class="muted">${new Date(o.created_at).toLocaleString('pt-BR')} · ${o.fulfillment==='entrega'?'Entrega':'Retirada'} · ${o.payment_method==='pix'?'Pix':o.payment_method==='credito'?'Cartão de crédito':'Cartão de débito'}</div></div><div><span class="status ${['concluido','pronto','pago'].includes(o.status)?'ok':''}">${esc(labels[o.status]||o.status)}</span><div style="margin-top:8px;font-weight:900">${brl(o.total)}</div></div></div>${(o.order_items||[]).map(i=>`<div style="border-top:1px solid #eeeaf4;margin-top:14px;padding-top:12px"><strong>${i.quantity}× ${esc(i.product_name)}</strong><div class="muted">${esc(Object.entries(i.options||{}).map(([k,v])=>`${k}: ${v}`).join(' · '))}</div><div class="files">${(o.order_files||[]).filter(f=>f.order_item_id===i.id).map(f=>`<button data-path="${esc(f.storage_path)}" data-name="${esc(f.original_name)}" data-action="view">Ver ${esc(f.original_name)}</button><button data-path="${esc(f.storage_path)}" data-name="${esc(f.original_name)}" data-action="download">Baixar</button>`).join('')}</div></div>`).join('')}</article>`).join('')};orders.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const{data,error}=await supabase.storage.from(STORAGE_BUCKET).createSignedUrl(b.dataset.path,120,{download:b.dataset.action==='download'?b.dataset.name:undefined});if(error){alert('Não foi possível abrir o arquivo.');return}window.open(data.signedUrl,'_blank','noopener')});logout.onclick=async()=>{await supabase.auth.signOut();location.href='/'};</script></body></html>

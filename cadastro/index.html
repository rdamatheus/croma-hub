<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | Croma</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f5fb;color:#29263b}.wrap{max-width:820px;margin:42px auto;padding:24px}.card{background:#fff;border:1px solid #e8e6ef;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(33,28,92,.08)}h1,h2{color:#211c5c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-weight:800;margin-bottom:6px;color:#30297F}.field input{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid #d9d6e6;border-radius:11px}.wide{grid-column:1/-1}.btn{border:0;border-radius:12px;padding:13px 18px;background:#30297F;color:#fff;font-weight:900;cursor:pointer}.msg{margin-top:14px;font-size:.9rem;color:#a83a3a}.ok{color:#567d25}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><section class="card"><a href="/conta/" style="text-decoration:none;color:#30297F;font-weight:900">← Entrar</a><h1>Criar conta</h1><p>Cadastre seus dados para enviar arquivos, finalizar pedidos e acompanhar seu histórico.</p><form id="form"><div class="grid"><div class="field wide"><label for="nome">Nome completo</label><input id="nome" required autocomplete="name"></div><div class="field"><label for="cpf">CPF</label><input id="cpf" required inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></div><div class="field"><label for="telefone">Celular</label><input id="telefone" required inputmode="tel" autocomplete="tel" placeholder="(32) 99999-9999"></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="nascimento">Data de nascimento <small>(opcional)</small></label><input id="nascimento" type="date"></div><div class="field"><label for="senha">Senha</label><input id="senha" type="password" required minlength="6" autocomplete="new-password"></div><div class="field"><label for="senha2">Confirmar senha</label><input id="senha2" type="password" required minlength="6" autocomplete="new-password"></div></div><h2>Endereço principal</h2><div class="grid"><div class="field"><label for="cep">CEP</label><input id="cep" required inputmode="numeric" maxlength="9"></div><div class="field"><label for="logradouro">Logradouro</label><input id="logradouro" required autocomplete="address-line1"></div><div class="field"><label for="numero">Número</label><input id="numero" required></div><div class="field"><label for="complemento">Complemento <small>(opcional)</small></label><input id="complemento"></div><div class="field"><label for="bairro">Bairro</label><input id="bairro" required></div><div class="field"><label for="cidade">Cidade</label><input id="cidade" required autocomplete="address-level2"></div><div class="field"><label for="estado">Estado (UF)</label><input id="estado" required maxlength="2" placeholder="MG"></div></div><p><button class="btn" type="submit">Criar minha conta</button></p></form><div id="msg" class="msg"></div></section></main><script type="module">import{supabase,onlyDigits}from'/js/croma-supabase.js?v=20260821-2';const form=document.querySelector('#form'),msg=document.querySelector('#msg');const show=(t,ok=false)=>{msg.textContent=t;msg.className=ok?'msg ok':'msg'};function validCPF(v){v=onlyDigits(v);if(v.length!==11||/^(\d)\1{10}$/.test(v))return false;let s=0;for(let i=0;i<9;i++)s+=+v[i]*(10-i);let d=(s*10)%11;if(d===10)d=0;if(d!==+v[9])return false;s=0;for(let i=0;i<10;i++)s+=+v[i]*(11-i);d=(s*10)%11;if(d===10)d=0;return d===+v[10]}form.addEventListener('submit',async e=>{e.preventDefault();const cpfClean=onlyDigits(cpf.value),phoneClean=onlyDigits(telefone.value),cepClean=onlyDigits(cep.value);if(!validCPF(cpfClean)){show('Informe um CPF válido.');return}if(phoneClean.length<10){show('Informe um celular válido.');return}if(cepClean.length!==8){show('Informe um CEP válido.');return}if(senha.value!==senha2.value){show('As senhas não são iguais.');return}show('Criando sua conta...',true);const{data,error}=await supabase.auth.signUp({email:email.value.trim(),password:senha.value,options:{data:{nome:nome.value.trim(),cpf:cpfClean,telefone:phoneClean,data_nascimento:nascimento.value||null}}});if(error){show(error.message.includes('already')?'Este e-mail já possui cadastro.':'Não foi possível criar a conta. Confira os dados.');return}if(!data.user){show('Não foi possível concluir o cadastro.');return}if(!data.session){show('Cadastro criado. Confirme seu e-mail para entrar.',true);return}const{error:addrError}=await supabase.from('customer_addresses').insert({customer_id:data.user.id,apelido:'Principal',cep:cepClean,logradouro:logradouro.value.trim(),numero:numero.value.trim(),complemento:complemento.value.trim()||null,bairro:bairro.value.trim(),cidade:cidade.value.trim(),estado:estado.value.trim().toUpperCase(),principal:true});if(addrError){show('Conta criada, mas não foi possível salvar o endereço. Entre na sua conta para concluir.',true);return}location.href='/conta/?cadastro=ok'});</script></body></html>

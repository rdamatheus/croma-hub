<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos | Croma</title><link rel="stylesheet" href="/css/service-pages.css?v=20260831-3"><style>body{background:#f7f7fb}.catalog-shell{max-width:1380px;margin:auto;padding:34px 24px 70px}.catalog-head{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:24px}.catalog-head h1{margin:7px 0 8px}.catalog-search{width:min(420px,100%)}.catalog-search input{margin:0}.catalog-layout{display:grid;grid-template-columns:270px 1fr;gap:24px}.sidebar{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;position:sticky;top:100px;align-self:start}.sidebar h2{margin:0 0 14px;font-size:1rem;color:var(--deep)}.filter-btn{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;color:#514f67;font:inherit}.filter-btn:hover,.filter-btn.active{background:#efeff8;color:var(--deep);font-weight:850}.filter-btn.depth-1{padding-left:22px}.filter-btn.depth-2{padding-left:36px;font-size:.9rem}.category-block{margin-bottom:30px}.category-title{display:flex;align-items:center;gap:10px;margin:0 0 14px;color:var(--deep)}.category-title .icon{font-size:1.7rem}.category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.category-card,.product-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;min-height:155px;transition:.18s}.category-card{cursor:pointer}.category-card:hover,.product-card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(48,41,127,.08)}.category-card .icon,.product-card .icon{font-size:2rem}.category-card h3,.product-card h3{margin:10px 0 5px;color:var(--deep);font-size:1rem}.category-card p,.product-card p{margin:0;color:var(--muted);font-size:.84rem;line-height:1.45}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.price{font-size:1.15rem!important;margin-top:10px!important;color:var(--deep)!important;font-weight:900}.empty{padding:22px;border:1px dashed #d7d4e4;border-radius:16px;color:var(--muted);background:#fff}@media(max-width:1000px){.category-grid{grid-template-columns:repeat(3,1fr)}.product-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.catalog-head{display:grid}.catalog-layout{grid-template-columns:1fr}.sidebar{position:static}.category-grid,.product-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.category-grid,.product-grid{grid-template-columns:1fr}.catalog-shell{padding:22px 14px 50px}}</style></head><body><header class="topbar"></header><main class="catalog-shell"><div class="catalog-head"><div><span class="eyebrow">Croma Papelaria & Presentes</span><h1>Produtos</h1><p class="lead">Papelaria, presentes e eletrônicos. O catálogo é organizado diretamente pelas categorias cadastradas no Croma Hub.</p></div><label class="catalog-search"><input id="search" type="search" placeholder="Buscar produto ou categoria"></label></div><div class="catalog-layout"><aside class="sidebar"><h2>Filtrar por categoria</h2><div id="filters"></div></aside><section><div id="content"><p class="empty">Carregando catálogo...</p></div></section></div></main><script src="/js/service-header.js?v=20260831-4" defer></script><script type="module">import{supabase}from'/js/croma-supabase.js?v=20260831-1';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));let cats=[],products=[],selected='all';function descendants(id){const out=new Set([id]);let changed=true;while(changed){changed=false;for(const c of cats)if(c.parent_id&&out.has(c.parent_id)&&!out.has(c.id)){out.add(c.id);changed=true}}return out}function depth(c){let d=0,p=c;while(p?.parent_id&&d<6){d++;p=cats.find(x=>x.id===p.parent_id)}return d}function icon(c){return c?.icon||'📦'}function renderFilters(){const rows=[...cats].sort((a,b)=>(a.ordem||0)-(b.ordem||0)||a.nome.localeCompare(b.nome));filters.innerHTML=`<button class="filter-btn ${selected==='all'?'active':''}" data-cat="all">Todos os produtos</button>`+rows.map(c=>`<button class="filter-btn depth-${Math.min(depth(c),2)} ${selected===c.id?'active':''}" data-cat="${c.id}">${esc(icon(c))} ${esc(c.nome)}</button>`).join('')}function render(){const q=search.value.trim().toLowerCase();let permitted=selected==='all'?new Set(cats.map(c=>c.id)):descendants(selected);const visibleProducts=products.filter(p=>permitted.has(p.catalog_category_id)&&(!q||[p.nome,p.sku].some(v=>String(v||'').toLowerCase().includes(q))));const visibleCats=cats.filter(c=>permitted.has(c.id)&&(!q||[c.nome,c.slug].some(v=>String(v||'').toLowerCase().includes(q))));const roots=cats.filter(c=>!c.parent_id);let html='';for(const root of roots){if(selected!=='all'&&!descendants(root.id).has(selected)&&selected!==root.id)continue;const children=visibleCats.filter(c=>c.parent_id===root.id);if(!children.length&&selected==='all')continue;html+=`<section class="category-block"><h2 class="category-title"><span class="icon">${esc(icon(root))}</span>${esc(root.nome)}</h2><div class="category-grid">${children.map(c=>`<article class="category-card" data-open-cat="${c.id}"><div class="icon">${esc(icon(c))}</div><h3>${esc(c.nome)}</h3><p>${esc(c.descricao||'Ver categorias e produtos')}</p></article>`).join('')}</div></section>`}if(visibleProducts.length)html+=`<section class="category-block"><div class="product-grid">${visibleProducts.map(p=>{const c=cats.find(x=>x.id===p.catalog_category_id);return`<article class="product-card"><div class="icon">${esc(icon(c))}</div><h3>${esc(p.nome)}</h3><p>${esc(c?.nome||'Sem categoria')} · ${esc(p.sku||'')}</p>${Number(p.preco)>0?`<p class="price">${Number(p.preco).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</p>`:''}</article>`}).join('')}</div></section>`;content.innerHTML=html||'<p class="empty">Nenhum resultado encontrado.</p>';renderFilters()}filters.onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;selected=b.dataset.cat;render()};content.onclick=e=>{const c=e.target.closest('[data-open-cat]');if(c){selected=c.dataset.openCat;render();scrollTo({top:0,behavior:'smooth'})}};search.oninput=render;const[c,p]=await Promise.all([supabase.from('catalog_categories').select('*').eq('ativo',true).eq('catalog_scope','produto').order('ordem'),supabase.from('products').select('id,nome,sku,preco,catalog_category_id,product_type,ativo').eq('ativo',true).eq('product_type','produto').order('nome')]);if(c.error||p.error){content.innerHTML=`<p class="empty">Não foi possível carregar o catálogo: ${esc((c.error||p.error).message)}</p>`}else{cats=c.data||[];products=p.data||[];renderFilters();render()}</script></body></html>

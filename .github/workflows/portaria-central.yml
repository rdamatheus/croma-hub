name: Portaria central
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  conformidade:
    name: conformidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Sem checkout, segredos, permissões de escrita ou execução de código da aplicação.
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const fields = ['Portaria-SHA','Documentos','Autorização','Escopo','Impactos','Validação','Pendências','Reversão'];
            const found = new Map();
            for (const field of fields) {
              const lines = body.split(/\r?\n/).filter(x => x.startsWith(field + ':'));
              if (lines.length !== 1 || !lines[0].slice(field.length + 1).trim()) {
                core.setFailed('Preencha uma única linha: ' + field);
                continue;
              }
              found.set(field, lines[0].slice(field.length + 1).trim());
            }
            for (const doc of ['docs/ARQUITETURA.md','docs/padrao-projeto-vivo.md','docs/EVOLUCAO_CROMA_HUB.md']) {
              if (!(found.get('Documentos') || '').includes(doc)) core.setFailed('Referencie: ' + doc);
            }
            let expected;
            try {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: 'AGENTS.md', ref: pr.base.sha
              });
              if (Array.isArray(file.data)) throw Error('AGENTS.md inválido');
              expected = file.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
              // Implantação inicial, somente enquanto a base não tem AGENTS.md.
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number
              });
              if (!files.some(f => f.filename === 'AGENTS.md' && f.status === 'added')) throw e;
              expected = 'bootstrap';
            }
            if (found.get('Portaria-SHA') !== expected) {
              core.setFailed('Consulte a versão vigente de AGENTS.md e informe seu SHA.');
            }
            core.info('Verificação estrutural: não comprova leitura, autorização ou qualidade dos testes.');

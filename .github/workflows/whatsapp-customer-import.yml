name: Teste do importador WhatsApp
on:
  pull_request:
    paths:
      - 'js/whatsapp-customer-import*.js'
      - 'tests/whatsapp-customer-import.test.mjs'
      - '.github/workflows/whatsapp-customer-import.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/whatsapp-customer-import.test.mjs
      - run: node --input-type=module --check < js/whatsapp-customer-import.js

      - run: node --input-type=module --check < js/whatsapp-customer-import-gallery.js

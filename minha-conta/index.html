<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha conta | Croma</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f5fb;color:#29263b}.wrap{max-width:900px;margin:40px auto;padding:22px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head a{color:#30297F;text-decoration:none;font-weight:900}.card{background:#fff;border:1px solid #e7e5ee;border-radius:22px;padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-weight:850;color:#30297F;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid #d9d6e5;border-radius:11px}.field input[disabled]{background:#f1f0f5;color:#777386}.wide{grid-column:1/-1}.btn{border:0;border-radius:11px;padding:12px 17px;background:#30297F;color:#fff;font-weight:900;cursor:pointer}.secondary{background:#fff;color:#30297F;border:1px solid #d9d5e6}.actions{display:flex;gap:10px;flex-wrap:wrap}.muted{color:#716d80}.msg{margin-top:12px;color:#a83a3a}.ok{color:#567d25}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="head"><a href="/">← Croma</a><div><a href="/meus-pedidos/">Meus pedidos</a></div></div><h1>Minha conta</h1><p class="muted">Consulte e atualize seus dados cadastrais. O CPF não pode ser alterado.</p><form id="form"><section class="card"><h2>Dados pessoais</h2><div class="grid"><div class="field wide"><label for="nome">Nome completo</label><input id="nome" required autocomplete="name"></div><div class="field"><label for="cpf">CPF</label><input id="cpf" disabled></div><div class="field"><label for="telefone">Celular</label><input id="telefone" required inputmode="tel" autocomplete="tel"></div><div class="field"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label for="nascimento">Data de nascimento</label><input id="nascimento" type="date"></div></div></section><section class="card"><h2>Endereço principal</h2><div class="grid"><div class="field"><label for="cep">CEP</label><input id="cep" required inputmode="numeric"></div><div class="field"><label for="logradouro">Logradouro</label><input id="logradouro" required></div><div class="field"><label for="numero">Número</label><input id="numero" required></div><div class="field"><label for="complemento">Complemento</label><input id="complemento"></div><div class="field"><label for="bairro">Bairro</label><input id="bairro" required></div><div class="field"><label for="cidade">Cidade</label><input id="cidade" required></div><div class="field"><label for="estado">Estado (UF)</label><input id="estado" required maxlength="2"></div></div></section><div class="actions"><button class="btn" type="submit">Salvar alterações</button><button class="btn secondary" type="button" id="logout">Sair da conta</button></div><div id="msg" class="msg"></div></form></main><script type="module">import{supabase,requireUser,onlyDigits}from'/js/croma-supabase.js?v=20260821-2';const user=await requireUser(location.href);if(!user)throw new Error('auth');const $=id=>document.getElementById(id),msg=$('msg');const show=(t,ok=false)=>{msg.textContent=t;msg.className=ok?'msg ok':'msg'};const{data:profile,error:pErr}=await supabase.from('customer_profiles').select('*').eq('id',user.id).single();const{data:addr}=await supabase.from('customer_addresses').select('*').eq('customer_id',user.id).eq('principal',true).maybeSingle();if(pErr){show('Não foi possível carregar seu cadastro.');throw pErr}$('nome').value=profile.nome||'';$('cpf').value=(profile.cpf||'').replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');$('telefone').value=profile.telefone||'';$('email').value=user.email||profile.email||'';$('nascimento').value=profile.data_nascimento||'';if(addr){for(const k of ['cep','logradouro','numero','complemento','bairro','cidade','estado'])$(k).value=addr[k]||''}$('form').addEventListener('submit',async e=>{e.preventDefault();const telefone=onlyDigits($('telefone').value),cep=onlyDigits($('cep').value),novoEmail=$('email').value.trim();if(telefone.length<10){show('Informe um celular válido.');return}if(cep.length!==8){show('Informe um CEP válido.');return}if($('estado').value.trim().length!==2){show('Informe a UF com 2 letras.');return}show('Salvando...',true);if(novoEmail!==user.email){const{error:eErr}=await supabase.auth.updateUser({email:novoEmail});if(eErr){show('Não foi possível alterar o e-mail.');return}}const{error:profErr}=await supabase.from('customer_profiles').update({nome:$('nome').value.trim(),telefone,email:novoEmail,data_nascimento:$('nascimento').value||null}).eq('id',user.id);if(profErr){show('Não foi possível salvar os dados pessoais.');return}const addressData={customer_id:user.id,apelido:'Principal',cep,logradouro:$('logradouro').value.trim(),numero:$('numero').value.trim(),complemento:$('complemento').value.trim()||null,bairro:$('bairro').value.trim(),cidade:$('cidade').value.trim(),estado:$('estado').value.trim().toUpperCase(),principal:true};let aErr;if(addr){({error:aErr}=await supabase.from('customer_addresses').update(addressData).eq('id',addr.id))}else{({error:aErr}=await supabase.from('customer_addresses').insert(addressData))}if(aErr){show('Os dados foram salvos, mas houve erro ao atualizar o endereço.');return}show('Cadastro atualizado com sucesso.',true)});$('logout').onclick=async()=>{await supabase.auth.signOut();location.href='/conta/'};</script></body></html>

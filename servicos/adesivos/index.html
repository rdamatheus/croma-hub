<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adesivos | Croma Hub</title><style>body{font-family:Arial,sans-serif;background:#f5f5fa;color:#211d4f;margin:0}.wrap{max-width:900px;margin:40px auto;padding:24px}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}label{font-weight:700}input,select{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccc;border-radius:10px}button{background:#30297f;color:white;border:0;padding:13px 20px;border-radius:10px;font-weight:700;cursor:pointer}.result{margin-top:18px;padding:18px;background:#f0effa;border-radius:12px}.muted{color:#666;font-size:14px}.ok{color:#176b3a}.no{color:#a32626}h1{margin-bottom:6px}</style></head><body><main class="wrap"><div class="card"><h1>Calculadora de Adesivos</h1><p class="muted">MVP interno Croma — custos provisórios de fornecedor, antes da margem comercial.</p><div class="grid"><label>Largura (cm)<input id="w" type="number" step="0.01" min="0" value="5"></label><label>Altura (cm)<input id="h" type="number" step="0.01" min="0" value="5"></label><label>Quantidade<input id="q" type="number" step="1" min="1" value="100"></label><label>Corte no vinil<select id="cut"><option value="none">Sem corte</option><option value="supplier">Fornecedor (+ R$ 10,00/m²)</option><option value="store">Corte na Croma (preço venda R$ 39,90/m²)</option></select></label></div><p><button onclick="calc()">Calcular opções</button></p><div id="out"></div></div></main><script>
const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function calc(){const w=+document.querySelector('#w').value,h=+document.querySelector('#h').value,q=+document.querySelector('#q').value,cut=document.querySelector('#cut').value,out=document.querySelector('#out');if(!w||!h||!q){out.innerHTML='<div class="result no">Preencha largura, altura e quantidade.</div>';return}const areaCm=w*h;const lots=Math.ceil(q/100);let html='';const boppOk=w>=3&&h>=3&&((w<=31&&h<=36)||(h<=31&&w<=36));if(boppOk){const boppBase=areaCm*.68*lots,bopp=boppBase+17;html+=`<div class="result"><strong>BOPP branco em bobina — RB16M2</strong><p class="ok">Disponível pelas medidas informadas.</p><p>${lots} lote(s) de 100 • área unitária ${areaCm.toFixed(2)} cm²</p><p>Custo: ${areaCm.toFixed(2)} × R$ 0,68 × ${lots} + R$ 17,00 frete = <strong>${money(bopp)}</strong></p><small>Limites cadastrados: mínimo 3×3 cm; máximo 31×36 cm.</small></div>`}else html+=`<div class="result"><strong>BOPP branco em bobina — RB16M2</strong><p class="no">Indisponível: medidas fora do intervalo 3×3 cm a 31×36 cm.</p></div>`;
const areaM=(w/100)*(h/100)*q;const widthOk=Math.min(w,h)<=120;if(widthOk){let supplier=42.5*areaM;let detail=`Vinil impresso: ${money(supplier)}`;if(cut==='supplier'){supplier+=10*areaM;detail+=` + meio corte fornecedor: ${money(10*areaM)}`}html+=`<div class="result"><strong>Vinil Branco Brilho / m² — VBBM2</strong><p class="ok">Disponível pela largura máxima de 1,20 m.</p><p>Área teórica: ${areaM.toFixed(4)} m²</p><p>${detail}</p><p>Custo fornecedor calculado: <strong>${money(supplier)}</strong></p>${cut==='store'?`<p>Corte interno Croma — preço de venda do acabamento: <strong>${money(39.9*areaM)}</strong></p>`:''}<small>Base provisória: R$ 42,50/m²; meio corte fornecedor R$ 10,00/m². Margem comercial ainda não aplicada.</small></div>`}else html+=`<div class="result"><strong>Vinil Branco Brilho / m² — VBBM2</strong><p class="no">Indisponível: largura mínima de encaixe ultrapassa 1,20 m.</p></div>`;out.innerHTML=html}
calc();</script></body></html>

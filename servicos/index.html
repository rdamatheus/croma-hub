<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serviços | Croma</title><link rel="stylesheet" href="../css/service-pages.css?v=20260831-5"><style>.shell{max-width:1320px}.dept{scroll-margin-top:110px;margin:44px 0 54px}.dept-head{margin-bottom:18px}.dept-head h2{margin:0;color:var(--deep);font-size:1.8rem}.dept-head p{margin:3px 0 0;color:var(--muted)}.service-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.service-card{overflow:hidden;padding:0!important}.service-card .media{height:180px;background:#eceaf3;overflow:hidden}.service-card .media img{width:100%;height:100%;object-fit:cover;display:block}.service-card .body{padding:18px}.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.error{padding:18px;border:1px dashed #e2bcbc;border-radius:14px;color:#a63838;background:#fff}@media(max-width:980px){.service-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.service-grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"></header><main class="shell"><div class="crumb"><a href="/">Início</a> › Serviços</div><p class="eyebrow">Catálogo de serviços</p><h1>Escolha o que você precisa.</h1><p class="lead">Serviços organizados por área, mantendo cada item em um único cadastro no banco.</p><div id="departments"><p class="empty">Carregando serviços...</p></div></main><script src="../js/service-header.js?v=20260831-5" defer></script><script type="module">import{supabase}from'/js/croma-supabase.js?v=20260831-1';const wrap=document.querySelector('#departments');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const FALLBACK='https://images.pexels.com/photos/8490095/pexels-photo-8490095.jpeg?auto=compress&cs=tinysrgb&w=1200';try{const rootQuery=await supabase.from('catalog_categories').select('id').eq('slug','servicos').single();if(rootQuery.error)throw rootQuery.error;const root=rootQuery.data;const[cq,pq,mq]=await Promise.all([supabase.from('catalog_categories').select('*').eq('catalog_scope','servico').eq('ativo',true).order('ordem').order('nome'),supabase.from('products').select('id,nome,slug,descricao,short_description,metadata,catalog_category_id,ativo').eq('product_type','servico').eq('ativo',true).order('nome'),supabase.from('product_media').select('product_id,url,alt_text,is_primary,ordem,ativo').eq('ativo',true)]);if(cq.error||pq.error||mq.error)throw cq.error||pq.error||mq.error;const cats=cq.data||[],products=pq.data||[],media=mq.data||[];const children=id=>cats.filter(c=>c.parent_id===id);const descendants=id=>{const out=new Set([id]);let changed=true;while(changed){changed=false;for(const c of cats){if(c.parent_id&&out.has(c.parent_id)&&!out.has(c.id)){out.add(c.id);changed=true}}}return out};const categoryImage=c=>{let p=c,g=0;while(p&&g++<10){if(p.image_url)return{url:p.image_url,alt:p.image_alt||p.nome};p=cats.find(x=>x.id===p.parent_id)}return{url:FALLBACK,alt:c?.nome||'Serviço Croma'}};const productImage=p=>{const own=media.filter(x=>x.product_id===p.id).sort((a,b)=>(b.is_primary-a.is_primary)||(a.ordem-b.ordem))[0];if(own)return{url:own.url,alt:own.alt_text||p.nome};return categoryImage(cats.find(x=>x.id===p.catalog_category_id))};const preferred=['servicos-graficos','comunicacao-visual','eventos-personalizados','fotografia','solucoes-digitais'];const depts=preferred.map(slug=>cats.find(c=>c.parent_id===root.id&&c.slug===slug)).filter(Boolean);wrap.innerHTML=depts.map(d=>{const ids=descendants(d.id);const ps=products.filter(p=>ids.has(p.catalog_category_id));return`<section class="dept" id="${esc(d.slug)}"><div class="dept-head"><h2>${esc(d.nome)}</h2><p>${esc(d.descricao||'')}</p></div>${ps.length?`<div class="service-grid">${ps.map(p=>{const href=p.metadata?.href||`/servicos/${p.slug}/`;const cat=cats.find(c=>c.id===p.catalog_category_id),im=productImage(p);return`<a class="service-card" href="${esc(href)}"><div class="media"><img src="${esc(im.url)}" alt="${esc(im.alt)}" loading="lazy"></div><div class="body"><span class="cat">${esc(cat?.nome||d.nome)}</span><h3>${esc(p.nome)}</h3><p>${esc(p.short_description||p.descricao||'Consulte opções, acabamentos e orçamento.')}</p><strong>Ver opções →</strong></div></a>`}).join('')}</div>`:'<p class="empty">Nenhum serviço ativo nesta área.</p>'}</section>`}).join('')||'<p class="empty">Nenhuma área de serviço cadastrada.</p>'}catch(e){console.error(e);wrap.innerHTML=`<p class="error">Não foi possível carregar o catálogo de serviços: ${esc(e.message||'erro desconhecido')}</p>`}</script></body></html>

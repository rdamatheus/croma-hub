<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serviços | Croma</title><link rel="stylesheet" href="../css/service-pages.css?v=20260831-3"><style>.shell{max-width:1320px}.dept{scroll-margin-top:110px;margin:44px 0 54px}.dept-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.dept-icon{font-size:2rem}.dept-head h2{margin:0;color:var(--deep);font-size:1.8rem}.dept-head p{margin:3px 0 0;color:var(--muted)}.service-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}@media(max-width:980px){.service-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.service-grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"></header><main class="shell"><div class="crumb"><a href="/">Início</a> › Serviços</div><p class="eyebrow">Catálogo de serviços</p><h1>Escolha o que você precisa.</h1><p class="lead">Os serviços da Croma estão organizados por área. Cada item continua sendo um único cadastro no banco, com categoria principal e segmentos relacionados.</p><div id="departments"><p class="empty">Carregando serviços...</p></div></main><script src="../js/service-header.js?v=20260831-4" defer></script><script type="module">import{supabase}from'/js/croma-supabase.js?v=20260831-1';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const root=(await supabase.from('catalog_categories').select('id').eq('slug','servicos').single()).data;const[cq,pq]=await Promise.all([supabase.from('catalog_categories').select('*').eq('catalog_scope','servico').eq('ativo',true).order('ordem'),supabase.from('products').select('id,nome,slug,descricao,short_description,metadata,catalog_category_id,ativo').eq('product_type','servico').eq('ativo',true).order('nome')]);if(cq.error||pq.error||!root){departments.innerHTML='<p class="empty">Não foi possível carregar o catálogo de serviços.</p>'}else{const cats=cq.data||[],products=pq.data||[];const children=id=>cats.filter(c=>c.parent_id===id);const descendants=id=>{const out=new Set([id]);let ch=true;while(ch){ch=false;for(const c of cats)if(c.parent_id&&out.has(c.parent_id)&&!out.has(c.id)){out.add(c.id);ch=true}}return out};const depts=children(root.id).filter(c=>c.show_in_navigation||['servicos-graficos','comunicacao-visual','eventos-personalizados','fotografia','solucoes-digitais'].includes(c.slug));departments.innerHTML=depts.map(d=>{const ids=descendants(d.id);const ps=products.filter(p=>ids.has(p.catalog_category_id));return`<section class="dept" id="${esc(d.slug)}"><div class="dept-head"><span class="dept-icon">${esc(d.icon||'◆')}</span><div><h2>${esc(d.nome)}</h2><p>${esc(d.descricao||'')}</p></div></div>${ps.length?`<div class="service-grid">${ps.map(p=>{const href=p.metadata?.href||`/servicos/${p.slug}/`;const cat=cats.find(c=>c.id===p.catalog_category_id);return`<a class="service-card" href="${esc(href)}"><div class="media">${esc(cat?.icon||d.icon||'◆')}</div><div class="body"><span class="cat">${esc(cat?.nome||d.nome)}</span><h3>${esc(p.nome)}</h3><p>${esc(p.short_description||p.descricao||'Consulte opções, acabamentos e orçamento.')}</p><strong>Ver opções →</strong></div></a>`}).join('')}</div>`:'<p class="empty">Novos serviços serão adicionados aqui.</p>'}</section>`}).join('')}};</script></body></html>

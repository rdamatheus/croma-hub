<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serviços Gráficos | Croma</title>
<link rel="stylesheet" href="../css/service-pages.css?v=20260903-1">
<style>
.shell{max-width:1320px}.catalog-intro{max-width:820px}.family-grid,.category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:26px;align-items:start}.family-card,.category-card{display:flex;flex-direction:column;padding:0!important;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;text-decoration:none;color:inherit;transition:.18s ease;min-height:250px}.family-card{cursor:pointer;text-align:left}.family-card:hover,.family-card.active,.category-card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(48,41,127,.09);border-color:#bdb7da}.family-card.active{box-shadow:0 16px 38px rgba(48,41,127,.14);border-color:#8f87c6}.family-media,.category-media{height:150px;background:#f2f0f7;overflow:hidden}.family-media img,.category-media img{width:100%;height:100%;object-fit:cover;display:block}.family-card.no-photo .family-media{display:none}.family-body,.category-body{padding:18px;display:flex;flex-direction:column;flex:1}.family-body h2,.category-body h3{margin:0 0 7px;color:var(--deep)}.family-body h2{font-size:1.08rem}.category-body h3{font-size:1rem}.family-body p,.category-body p{margin:0;color:var(--muted);font-size:.86rem;line-height:1.5}.card-action{margin-top:auto;padding-top:14px;color:var(--deep);font-weight:900}.family-expansion{grid-column:1/-1;border:1px solid #d7d2e8;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 18px 44px rgba(48,41,127,.11);animation:familyStretch .3s ease both;transform-origin:var(--origin-x,50%) top}.family-expanded-hero{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(0,1.1fr);min-height:260px;background:#f8f7fc}.family-expanded-photo{min-height:260px;background:#ece9f6;overflow:hidden}.family-expanded-photo img{width:100%;height:100%;object-fit:cover;display:block}.family-expanded-copy{padding:32px;display:flex;flex-direction:column;justify-content:center;position:relative}.family-expanded-copy .eyebrow{margin-bottom:8px}.family-expanded-copy h2{margin:0 0 10px;color:var(--deep);font-size:clamp(1.7rem,3vw,2.6rem)}.family-expanded-copy p{margin:0;max-width:680px;color:var(--muted);line-height:1.6}.family-close{position:absolute;top:20px;right:20px;border:1px solid var(--line);background:#fff;color:var(--deep);border-radius:999px;padding:8px 12px;font:inherit;font-weight:850;cursor:pointer}.family-categories{padding:24px;border-top:1px solid #e8e5f1;background:#fcfbfe}.family-categories-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:2px}.family-categories-head h3{margin:0;color:var(--deep);font-size:1.2rem}.family-categories-head p{margin:4px 0 0;color:var(--muted)}.category-grid{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px}.category-card{min-height:220px}.category-media{height:130px}.back-link{display:inline-flex;margin:8px 0 20px;color:var(--deep);font-weight:850;text-decoration:none}.section-head{margin:4px 0 20px}.section-head h1{margin:0;color:var(--deep)}.catalog-tools{display:grid;grid-template-columns:minmax(260px,1fr) 220px;gap:12px;margin:20px 0 18px}.catalog-tools input,.catalog-tools select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit}.service-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.service-card{display:flex;flex-direction:column;overflow:hidden;padding:0!important;text-decoration:none;color:inherit}.service-card .media{height:180px;background:#eceaf3;overflow:hidden}.service-card .media img{width:100%;height:100%;object-fit:cover}.service-card .body{padding:18px;display:flex;flex-direction:column;flex:1}.service-card h3{margin:0 0 8px;color:var(--deep);font-size:1rem}.service-card p{margin:0;color:var(--muted);font-size:.86rem;line-height:1.45}.service-card .price{margin-top:auto;padding-top:12px;color:var(--deep);font-weight:900}.empty{padding:20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);background:#fff}.error{padding:18px;border:1px dashed #e2bcbc;border-radius:14px;color:#a63838;background:#fff}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:26px 0}.pager button{border:1px solid var(--line);background:#fff;color:var(--deep);border-radius:10px;padding:9px 12px;font:inherit;font-weight:850;cursor:pointer}.pager button:disabled{opacity:.45}@keyframes familyStretch{from{opacity:0;transform:scaleX(.88) translateY(-8px)}to{opacity:1;transform:scaleX(1) translateY(0)}}@media(max-width:980px){.family-grid{grid-template-columns:repeat(2,1fr)}.category-grid,.service-grid{grid-template-columns:repeat(2,1fr)}.family-expanded-hero{grid-template-columns:1fr 1fr}}@media(max-width:700px){.catalog-tools{grid-template-columns:1fr}.family-expanded-hero{grid-template-columns:1fr}.family-expanded-photo{min-height:210px}.family-expanded-copy{padding:24px}.family-close{top:14px;right:14px}.family-categories-head{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.family-grid,.category-grid,.service-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"></header>
<main class="shell">
<div class="crumb"><a href="/">Início</a> › Serviços Gráficos</div>
<div id="catalogRoot"><p class="empty">Carregando serviços...</p></div>
</main>
<script src="/js/safe-images.js?v=20260903-1" defer></script>
<script src="../js/service-header.js?v=20260905-2" defer></script>
<script type="module">
import { supabase } from '/js/croma-supabase.js?v=20260905-2';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const plain=s=>{const d=document.createElement('div');d.innerHTML=String(s??'');return(d.textContent||'').replace(/\s+/g,' ').trim()};
const PAGE_SIZE=500,UI_PAGE_SIZE=36;
const params=new URLSearchParams(location.search),categorySlug=params.get('categoria')||'',familySlug=params.get('familia')||'';
let families=[],categories=[],page=1,currentServiceRows=[],mediaMap=new Map();
async function fetchAll(build){const out=[];for(let from=0;;from+=PAGE_SIZE){const{data,error}=await build().range(from,from+PAGE_SIZE-1);if(error)throw error;const rows=data||[];out.push(...rows);if(rows.length<PAGE_SIZE)break}return out}
function familyImage(f){return f?.image_url?`<div class="family-media"><img src="${esc(f.image_url)}" alt="${esc(f.image_alt||f.nome)}" loading="lazy" decoding="async"></div>`:'<div class="family-media"></div>'}
function expandedFamilyImage(f){return f?.image_url?`<div class="family-expanded-photo"><img src="${esc(f.image_url)}" alt="${esc(f.image_alt||f.nome)}" loading="lazy" decoding="async"></div>`:'<div class="family-expanded-photo"></div>'}
function categoryImage(c){return c?.image_url?`<div class="category-media"><img src="${esc(c.image_url)}" alt="${esc(c.image_alt||c.nome)}" loading="lazy" decoding="async"></div>`:'<div class="category-media"></div>'}
function catsForFamily(id){return categories.filter(c=>c.family_id===id&&c.ativo!==false).sort((a,b)=>(a.ordem||0)-(b.ordem||0)||String(a.nome).localeCompare(String(b.nome),'pt-BR'))}
function setFamilyInUrl(slug=''){const u=new URL(location.href);u.searchParams.delete('categoria');if(slug)u.searchParams.set('familia',slug);else u.searchParams.delete('familia');history.replaceState({},'',u.pathname+(u.search?u.search:''))}
function closeFamily(updateUrl=true){document.querySelector('.family-expansion')?.remove();document.querySelectorAll('[data-family]').forEach(x=>x.classList.remove('active'));if(updateUrl)setFamilyInUrl('')}
function renderHome(){
  $('#catalogRoot').innerHTML=`<div class="catalog-intro"><p class="eyebrow">Serviços Gráficos</p><h1>Escolha uma solução.</h1><p class="lead">As famílias organizam os serviços por finalidade. Clique em uma delas para ver as categorias relacionadas.</p></div><div class="family-grid" id="familyGrid">${families.map(f=>`<button class="family-card ${f.image_url?'':'no-photo'}" type="button" data-family="${esc(f.slug)}">${familyImage(f)}<span class="family-body"><h2>${esc(f.nome)}</h2><p>${esc(f.descricao||'Conheça as categorias disponíveis.')}</p><span class="card-action">Ver categorias ↓</span></span></button>`).join('')}</div>`;
  document.querySelectorAll('[data-family]').forEach(btn=>btn.addEventListener('click',()=>openFamily(btn.dataset.family,btn)));
}
function openFamily(slug,sourceButton){
  const f=families.find(x=>x.slug===slug),grid=$('#familyGrid');if(!f||!grid)return;
  const cards=[...grid.querySelectorAll('[data-family]')],button=sourceButton||cards.find(x=>x.dataset.family===slug);if(!button)return;
  if(button.classList.contains('active')&&grid.querySelector('.family-expansion')){closeFamily();return}
  closeFamily(false);
  const freshCards=[...grid.querySelectorAll('[data-family]')],active=freshCards.find(x=>x.dataset.family===slug);if(!active)return;
  active.classList.add('active');
  const columns=Math.max(1,getComputedStyle(grid).gridTemplateColumns.split(/\s+/).filter(Boolean).length),index=freshCards.indexOf(active),rowEnd=Math.min(Math.ceil((index+1)/columns)*columns-1,freshCards.length-1),anchor=freshCards[rowEnd];
  const cats=catsForFamily(f.id),box=document.createElement('section'),gridRect=grid.getBoundingClientRect(),cardRect=active.getBoundingClientRect(),origin=Math.max(0,Math.min(100,((cardRect.left+cardRect.width/2-gridRect.left)/Math.max(1,gridRect.width))*100));
  box.className='family-expansion';box.setAttribute('aria-live','polite');box.style.setProperty('--origin-x',`${origin}%`);
  box.innerHTML=`<div class="family-expanded-hero">${expandedFamilyImage(f)}<div class="family-expanded-copy"><button class="family-close" type="button" id="closeFamily">Fechar</button><p class="eyebrow">Serviços Gráficos</p><h2>${esc(f.nome)}</h2><p>${esc(f.descricao||'Selecione uma categoria para continuar.')}</p></div></div><div class="family-categories"><div class="family-categories-head"><div><h3>Escolha uma categoria</h3><p>Veja as opções disponíveis dentro de ${esc(f.nome)}.</p></div></div>${cats.length?`<div class="category-grid">${cats.map(c=>`<a class="category-card" href="/servicos/?familia=${encodeURIComponent(f.slug)}&categoria=${encodeURIComponent(c.slug)}">${categoryImage(c)}<span class="category-body"><h3>${esc(c.nome)}</h3><p>${esc(c.descricao||'Veja as opções desta categoria.')}</p><span class="card-action">Abrir categoria →</span></span></a>`).join('')}</div>`:'<div class="empty">As categorias desta família estão sendo organizadas.</div>'}</div>`;
  anchor.after(box);$('#closeFamily')?.addEventListener('click',()=>closeFamily());setFamilyInUrl(slug);
  requestAnimationFrame(()=>box.scrollIntoView({behavior:'smooth',block:'nearest'}));
}
async function loadCategoryServices(cat){
  const descendants=[cat.id,...categories.filter(c=>c.parent_id===cat.id&&c.ativo!==false).map(c=>c.id)];
  currentServiceRows=await fetchAll(()=>supabase.from('products').select('id,nome,sku,slug,descricao,short_description,metadata,catalog_category_id,preco,ativo,product_type').eq('product_type','servico').eq('ativo',true).in('catalog_category_id',descendants).order('nome'));
  mediaMap=new Map();
  const ids=currentServiceRows.map(x=>x.id);
  for(let i=0;i<ids.length;i+=180){const chunk=ids.slice(i,i+180);if(!chunk.length)continue;const{data,error}=await supabase.from('product_media').select('product_id,url,is_primary,ordem,ativo,kind').in('product_id',chunk).eq('ativo',true).eq('kind','image').order('is_primary',{ascending:false}).order('ordem');if(error)throw error;for(const m of data||[])if(m.product_id&&m.url&&!mediaMap.has(m.product_id))mediaMap.set(m.product_id,m.url)}
}
function safeHref(p){const href=String(p.metadata?.href||'').trim();return href.startsWith('/')&&!href.startsWith('//')?href:''}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function renderCategory(f,cat){
  $('#catalogRoot').innerHTML=`<a class="back-link" href="/servicos/?familia=${encodeURIComponent(f?.slug||'')}">← Voltar para ${esc(f?.nome||'famílias')}</a><div class="section-head"><p class="eyebrow">${esc(f?.nome||'Serviços Gráficos')}</p><h1>${esc(cat.nome)}</h1><p class="lead">${esc(cat.descricao||'Confira as opções disponíveis.')}</p></div><div class="catalog-tools"><input id="serviceSearch" type="search" placeholder="Buscar nesta categoria"><select id="serviceSort"><option value="name">Ordenar por nome</option><option value="price">Menor preço</option></select></div><div id="serviceCount" class="muted"></div><div id="serviceGrid" class="service-grid"></div><div id="servicePager" class="pager"></div>`;
  const redraw=()=>{const q=($('#serviceSearch')?.value||'').trim().toLowerCase();let rows=currentServiceRows.filter(p=>!q||[p.nome,p.sku,plain(p.short_description),plain(p.descricao)].some(v=>String(v||'').toLowerCase().includes(q)));rows=$('#serviceSort')?.value==='price'?[...rows].sort((a,b)=>Number(a.preco||0)-Number(b.preco||0)):[...rows].sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));renderServices(rows)};
  $('#serviceSearch').addEventListener('input',()=>{page=1;redraw()});$('#serviceSort').addEventListener('change',()=>{page=1;redraw()});redraw();
}
function renderServices(rows){const grid=$('#serviceGrid');if(!grid)return;const pages=Math.max(1,Math.ceil(rows.length/UI_PAGE_SIZE));if(page>pages)page=pages;const shown=rows.slice((page-1)*UI_PAGE_SIZE,page*UI_PAGE_SIZE);$('#serviceCount').textContent=`${rows.length} serviço(s)`;grid.innerHTML=shown.length?shown.map(p=>{const im=mediaMap.get(p.id),href=safeHref(p)||'/#orcamento',desc=plain(p.short_description||p.descricao)||'Consulte opções e solicite seu orçamento.';return`<a class="service-card" href="${esc(href)}"><div class="media">${im?`<img src="${esc(im)}" alt="${esc(p.nome)}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:'<div class="croma-photo-missing" style="height:100%"></div>'}</div><div class="body"><h3>${esc(p.nome)}</h3><p>${esc(desc)}</p>${Number(p.preco)>0?`<div class="price">A partir de ${esc(money(p.preco))}</div>`:''}<span class="card-action">${safeHref(p)?'Ver detalhes':'Solicitar orçamento'} →</span></div></a>`}).join(''):'<div class="empty">Ainda não há serviços publicados nesta categoria.</div>';$('#servicePager').innerHTML=pages>1?`<button id="prevPage" ${page<=1?'disabled':''}>Anterior</button><span>Página ${page} de ${pages}</span><button id="nextPage" ${page>=pages?'disabled':''}>Próxima</button>`:'';$('#prevPage')?.addEventListener('click',()=>{if(page>1){page--;renderServices(rows)}});$('#nextPage')?.addEventListener('click',()=>{if(page<pages){page++;renderServices(rows)}})}
try{
  const [fs,cats]=await Promise.all([
    fetchAll(()=>supabase.from('catalog_families').select('id,nome,slug,descricao,ordem,ativo,image_url,image_alt,catalog_scope').eq('catalog_scope','servico').eq('ativo',true).order('ordem').order('nome')),
    fetchAll(()=>supabase.from('catalog_categories').select('id,nome,slug,parent_id,family_id,ordem,catalog_scope,ativo,descricao,image_url,image_alt').eq('catalog_scope','servico').eq('ativo',true).order('ordem').order('nome'))
  ]);
  families=fs;categories=cats;
  if(categorySlug){const cat=categories.find(c=>c.slug===categorySlug);const fam=families.find(f=>f.id===cat?.family_id)||families.find(f=>f.slug===familySlug);if(!cat||!fam){renderHome()}else{await loadCategoryServices(cat);renderCategory(fam,cat)}}else{renderHome();if(familySlug)requestAnimationFrame(()=>{const btn=document.querySelector(`[data-family="${CSS.escape(familySlug)}"]`);openFamily(familySlug,btn)})}
}catch(e){console.error('Falha ao carregar catálogo de serviços.',e);$('#catalogRoot').innerHTML='<p class="error">Não foi possível carregar os serviços agora. Tente novamente em instantes.</p>'}
</script>
</body>
</html>

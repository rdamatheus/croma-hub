<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serviços Gráficos | Croma</title>
<link rel="stylesheet" href="../css/service-pages.css?v=20260903-1">
<style>
.shell{max-width:1320px}.catalog-tools{display:grid;grid-template-columns:minmax(260px,1fr) 280px;gap:12px;margin:26px 0 22px}.catalog-tools input,.catalog-tools select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit;color:var(--deep)}.service-summary{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 18px}.service-summary strong{color:var(--deep)}.service-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.service-card{display:flex;flex-direction:column;overflow:hidden;padding:0!important;text-decoration:none;color:inherit}.service-card .media{height:180px;background:#eceaf3;overflow:hidden}.service-card .media img{width:100%;height:100%;object-fit:cover;display:block}.service-card .body{padding:18px;display:flex;flex-direction:column;flex:1}.service-card .cat{display:block;margin-bottom:6px;color:var(--muted);font-size:.76rem;font-weight:800}.service-card h3{margin:0 0 8px;color:var(--deep);font-size:1.05rem;line-height:1.28}.service-card p{margin:0 0 12px;color:var(--muted);line-height:1.48;font-size:.88rem}.service-card .price{margin-top:auto;padding-top:8px;color:var(--deep);font-weight:900}.service-card .action{display:inline-flex;margin-top:9px;color:var(--deep);font-weight:900}.service-card.static{cursor:default}.empty{padding:20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);background:#fff}.error{padding:18px;border:1px dashed #e2bcbc;border-radius:14px;color:#a63838;background:#fff}.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin:28px 0 8px}.pager button{border:1px solid var(--line);background:#fff;color:var(--deep);border-radius:10px;padding:9px 12px;font:inherit;font-weight:850;cursor:pointer}.pager button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:980px){.service-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.catalog-tools{grid-template-columns:1fr}.service-summary{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.service-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"></header>
<main class="shell">
<div class="crumb"><a href="/">Início</a> › Serviços Gráficos</div>
<p class="eyebrow">Serviços Gráficos</p>
<h1>Encontre o serviço que você precisa.</h1>
<p class="lead">Consulte os serviços disponíveis, opções e valores cadastrados pela Croma.</p>
<div class="catalog-tools">
<input id="serviceSearch" type="search" placeholder="Buscar serviço">
<select id="serviceCategory" aria-label="Filtrar por categoria"><option value="">Todas as categorias</option></select>
</div>
<div class="service-summary"><strong id="serviceCount">Carregando serviços...</strong></div>
<div id="serviceGrid" class="service-grid"></div>
<div id="servicePager" class="pager"></div>
</main>
<script src="/js/safe-images.js?v=20260903-1" defer></script>
<script src="../js/service-header.js?v=20260905-2" defer></script>
<script type="module">
import { supabase } from '/js/croma-supabase.js?v=20260905-2';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const PAGE_SIZE=500,UI_PAGE_SIZE=48;
let services=[],categories=[],mediaMap=new Map(),page=1;
const $=s=>document.querySelector(s);
async function fetchAll(build){const out=[];for(let from=0;;from+=PAGE_SIZE){const{data,error}=await build().range(from,from+PAGE_SIZE-1);if(error)throw error;const rows=data||[];out.push(...rows);if(rows.length<PAGE_SIZE)break}return out}
function categoryPath(c){if(!c)return'';const names=[c.nome];let p=categories.find(x=>x.id===c.parent_id),guard=0;while(p&&guard++<8){names.unshift(p.nome);p=categories.find(x=>x.id===p.parent_id)}return names.join(' › ')}
function publicCategoryName(c){const raw=categoryPath(c)||'Serviços Gráficos';return /bling|importad/i.test(raw)?'Serviços Gráficos':raw}
function imageFor(p){return mediaMap.get(p.id)||null}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function safeHref(p){const href=String(p.metadata?.href||'').trim();if(href.startsWith('/')&&!href.startsWith('//'))return href;return''}
function filtered(){const q=($('#serviceSearch')?.value||'').trim().toLowerCase(),cat=$('#serviceCategory')?.value||'';return services.filter(p=>{if(cat&&p.catalog_category_id!==cat)return false;if(!q)return true;const c=publicCategoryName(categories.find(x=>x.id===p.catalog_category_id));return[p.nome,p.sku,p.short_description,p.descricao,c].some(v=>String(v||'').toLowerCase().includes(q))})}
function renderCategories(){const sel=$('#serviceCategory');if(!sel)return;const current=sel.value;const used=new Set(services.map(x=>x.catalog_category_id).filter(Boolean));const rows=categories.filter(c=>c.ativo!==false&&used.has(c.id)).sort((a,b)=>publicCategoryName(a).localeCompare(publicCategoryName(b),'pt-BR'));const seen=new Set();sel.innerHTML='<option value="">Todas as categorias</option>'+rows.filter(c=>{const n=publicCategoryName(c);if(seen.has(n))return false;seen.add(n);return true}).map(c=>`<option value="${c.id}">${esc(publicCategoryName(c))}</option>`).join('');sel.value=current}
function render(){const rows=filtered();const pages=Math.max(1,Math.ceil(rows.length/UI_PAGE_SIZE));if(page>pages)page=pages;const shown=rows.slice((page-1)*UI_PAGE_SIZE,page*UI_PAGE_SIZE);$('#serviceCount').textContent=`${rows.length} serviço(s) encontrado(s)`;$('#serviceGrid').innerHTML=shown.length?shown.map(p=>{const c=categories.find(x=>x.id===p.catalog_category_id),im=imageFor(p),href=safeHref(p),desc=p.short_description||p.descricao||'Consulte opções e solicite seu orçamento.';const body=`<div class="media">${im?`<img src="${esc(im)}" alt="${esc(p.nome)}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:'<div class="croma-photo-missing" style="height:100%"></div>'}</div><div class="body"><span class="cat">${esc(publicCategoryName(c))}</span><h3>${esc(p.nome)}</h3><p>${esc(desc)}</p>${Number(p.preco)>0?`<div class="price">A partir de ${esc(money(p.preco))}</div>`:''}<span class="action">${href?'Ver detalhes':'Solicitar orçamento'} →</span></div>`;return href?`<a class="service-card" href="${esc(href)}">${body}</a>`:`<a class="service-card" href="/#orcamento">${body}</a>`}).join(''):'<p class="empty">Nenhum serviço encontrado.</p>';$('#servicePager').innerHTML=pages>1?`<button id="prevPage" ${page<=1?'disabled':''}>Anterior</button><span>Página ${page} de ${pages}</span><button id="nextPage" ${page>=pages?'disabled':''}>Próxima</button>`:'';$('#prevPage')?.addEventListener('click',()=>{if(page>1){page--;render();scrollTo({top:0,behavior:'smooth'})}});$('#nextPage')?.addEventListener('click',()=>{if(page<pages){page++;render();scrollTo({top:0,behavior:'smooth'})}})}
$('#serviceSearch').addEventListener('input',()=>{page=1;render()});$('#serviceCategory').addEventListener('change',()=>{page=1;render()});
try{const [cats,prods,medias]=await Promise.all([fetchAll(()=>supabase.from('catalog_categories').select('id,nome,parent_id,ordem,catalog_scope,ativo').eq('ativo',true).order('ordem').order('nome')),fetchAll(()=>supabase.from('products').select('id,nome,sku,slug,descricao,short_description,metadata,catalog_category_id,preco,ativo,product_type').eq('product_type','servico').eq('ativo',true).order('nome')),fetchAll(()=>supabase.from('product_media').select('product_id,url,is_primary,ordem,ativo,kind').eq('ativo',true).eq('kind','image').order('is_primary',{ascending:false}).order('ordem'))]);categories=cats;services=prods;for(const m of medias)if(m.product_id&&m.url&&!mediaMap.has(m.product_id))mediaMap.set(m.product_id,m.url);renderCategories();render()}catch(e){console.error('Falha ao carregar serviços públicos.',e);$('#serviceCount').textContent='';$('#serviceGrid').innerHTML='<p class="error">Não foi possível carregar os serviços agora. Tente novamente em instantes.</p>'}
</script>
</body>
</html>

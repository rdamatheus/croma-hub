<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serviços Gráficos | Croma</title>
<link rel="stylesheet" href="../css/service-pages.css?v=20260903-1">
<style>
.shell{max-width:1320px}.catalog-intro{max-width:780px}.group-grid,.category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:26px}.group-card,.category-card{display:flex;flex-direction:column;min-height:240px;padding:0!important;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;text-decoration:none;color:inherit;transition:.18s ease}.group-card:hover,.category-card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(48,41,127,.09);border-color:#c9c4de}.group-media,.category-media{height:140px;background:linear-gradient(135deg,#efedf7,#e4e0f1);display:grid;place-items:center;overflow:hidden}.group-media img,.category-media img{width:100%;height:100%;object-fit:cover}.group-icon,.category-icon{font-size:2.1rem}.group-body,.category-body{padding:18px;display:flex;flex-direction:column;flex:1}.group-body h2,.category-body h3{margin:0 0 7px;color:var(--deep)}.group-body h2{font-size:1.08rem}.category-body h3{font-size:1rem}.group-body p,.category-body p{margin:0;color:var(--muted);font-size:.86rem;line-height:1.5}.card-action{margin-top:auto;padding-top:14px;color:var(--deep);font-weight:900}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:30px 0 6px}.section-head h1,.section-head h2{margin:0;color:var(--deep)}.back-link{display:inline-flex;margin:8px 0 20px;color:var(--deep);font-weight:850;text-decoration:none}.catalog-tools{display:grid;grid-template-columns:minmax(260px,1fr) 280px;gap:12px;margin:24px 0 18px}.catalog-tools input,.catalog-tools select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit}.service-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.service-card{display:flex;flex-direction:column;overflow:hidden;padding:0!important;text-decoration:none;color:inherit}.service-card .media{height:180px;background:#eceaf3;overflow:hidden}.service-card .media img{width:100%;height:100%;object-fit:cover}.service-card .body{padding:18px;display:flex;flex-direction:column;flex:1}.service-card h3{margin:0 0 8px;color:var(--deep);font-size:1rem}.service-card p{margin:0;color:var(--muted);font-size:.86rem;line-height:1.45}.service-card .price{margin-top:auto;padding-top:12px;color:var(--deep);font-weight:900}.empty{padding:20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);background:#fff}.error{padding:18px;border:1px dashed #e2bcbc;border-radius:14px;color:#a63838;background:#fff}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:26px 0}.pager button{border:1px solid var(--line);background:#fff;color:var(--deep);border-radius:10px;padding:9px 12px;font:inherit;font-weight:850;cursor:pointer}.pager button:disabled{opacity:.45}@media(max-width:980px){.group-grid,.category-grid{grid-template-columns:repeat(2,1fr)}.service-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.catalog-tools{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.group-grid,.category-grid,.service-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"></header>
<main class="shell">
<div class="crumb"><a href="/">Início</a> › Serviços Gráficos</div>
<div id="catalogRoot"><p class="empty">Carregando serviços...</p></div>
</main>
<script src="/js/safe-images.js?v=20260903-1" defer></script>
<script src="../js/service-header.js?v=20260905-2" defer></script>
<script type="module">
import { supabase } from '/js/croma-supabase.js?v=20260905-2';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const PAGE_SIZE=500,UI_PAGE_SIZE=36;
const params=new URLSearchParams(location.search),groupSlug=params.get('grupo')||'',categorySlug=params.get('categoria')||'';
const MAIN_SLUGS=['grafica-rapida','papelaria-personalizada','comunicacao-visual','brindes','fotografia','presentes','identidade-visual'];
const ICONS={'grafica-rapida':'🖨️','papelaria-personalizada':'✂️','comunicacao-visual':'🪧','brindes':'🎁','fotografia':'📷','presentes':'✨','identidade-visual':'🎨','impressoes':'📄','cartoes-de-visita':'💳','panfletos':'📑','blocos':'🗒️','adesivos':'🏷️','banners':'🖼️','placas-acm-categoria':'🔲','fotos-produtos-fotograficos':'📸','criacao-logotipo':'✏️','manual-de-marca':'📘','papelaria-corporativa':'📁','casamentos':'💍'};
let categories=[],services=[],mediaMap=new Map(),page=1;
async function fetchAll(build){const out=[];for(let from=0;;from+=PAGE_SIZE){const{data,error}=await build().range(from,from+PAGE_SIZE-1);if(error)throw error;const rows=data||[];out.push(...rows);if(rows.length<PAGE_SIZE)break}return out}
function imageMarkup(c,cls){if(c?.image_url)return`<img src="${esc(c.image_url)}" alt="${esc(c.image_alt||c.nome)}" loading="lazy">`;return`<span class="${cls}">${ICONS[c?.slug]||'✦'}</span>`}
function children(id){return categories.filter(c=>c.parent_id===id&&c.ativo!==false).sort((a,b)=>(a.ordem||0)-(b.ordem||0)||String(a.nome).localeCompare(String(b.nome),'pt-BR'))}
function descendants(id){const out=new Set([id]);let changed=true;while(changed){changed=false;for(const c of categories)if(c.parent_id&&out.has(c.parent_id)&&!out.has(c.id)){out.add(c.id);changed=true}}return out}
function safeHref(p){const href=String(p.metadata?.href||'').trim();return href.startsWith('/')&&!href.startsWith('//')?href:''}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function renderHome(root){const mains=MAIN_SLUGS.map(slug=>categories.find(c=>c.slug===slug&&c.parent_id===root.id&&c.ativo!==false)).filter(Boolean);$('#catalogRoot').innerHTML=`<div class="catalog-intro"><p class="eyebrow">Serviços Gráficos</p><h1>O que você precisa criar?</h1><p class="lead">Escolha uma área para ver as categorias e soluções disponíveis na Croma.</p></div><div class="group-grid">${mains.map(c=>`<a class="group-card" href="/servicos/?grupo=${encodeURIComponent(c.slug)}"><div class="group-media">${imageMarkup(c,'group-icon')}</div><div class="group-body"><h2>${esc(c.nome)}</h2><p>${esc(c.descricao||'Conheça as opções disponíveis.')}</p><span class="card-action">Ver categorias →</span></div></a>`).join('')}</div>`}
function renderGroup(group){const subs=children(group.id);const groupServices=services.filter(p=>p.catalog_category_id===group.id);$('#catalogRoot').innerHTML=`<a class="back-link" href="/servicos/">← Todas as áreas</a><div class="section-head"><div><p class="eyebrow">Serviços Gráficos</p><h1>${esc(group.nome)}</h1><p class="lead">${esc(group.descricao||'Escolha uma categoria para continuar.')}</p></div></div>${subs.length?`<div class="category-grid">${subs.map(c=>`<a class="category-card" href="/servicos/?grupo=${encodeURIComponent(group.slug)}&categoria=${encodeURIComponent(c.slug)}"><div class="category-media">${imageMarkup(c,'category-icon')}</div><div class="category-body"><h3>${esc(c.nome)}</h3><p>${esc(c.descricao||'Veja os serviços desta categoria.')}</p><span class="card-action">Ver serviços →</span></div></a>`).join('')}</div>`:groupServices.length?'<div id="directServices"></div>':'<div class="empty">Fale com a Croma para conhecer as opções disponíveis nesta área.</div>'}`;if(groupServices.length&&!subs.length)renderServices(groupServices,group)}
function renderCategory(group,cat){const ids=descendants(cat.id),base=services.filter(p=>ids.has(p.catalog_category_id));$('#catalogRoot').innerHTML=`<a class="back-link" href="/servicos/?grupo=${encodeURIComponent(group.slug)}">← ${esc(group.nome)}</a><div class="section-head"><div><p class="eyebrow">${esc(group.nome)}</p><h1>${esc(cat.nome)}</h1><p class="lead">${esc(cat.descricao||'Confira as opções disponíveis.')}</p></div></div><div class="catalog-tools"><input id="serviceSearch" type="search" placeholder="Buscar nesta categoria"><select id="serviceSort"><option value="name">Ordenar por nome</option><option value="price">Menor preço</option></select></div><div id="serviceCount" class="muted"></div><div id="serviceGrid" class="service-grid"></div><div id="servicePager" class="pager"></div>`;const redraw=()=>{const q=($('#serviceSearch')?.value||'').trim().toLowerCase();let rows=base.filter(p=>!q||[p.nome,p.sku,p.short_description,p.descricao].some(v=>String(v||'').toLowerCase().includes(q)));if($('#serviceSort')?.value==='price')rows=[...rows].sort((a,b)=>Number(a.preco||0)-Number(b.preco||0));else rows=[...rows].sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));renderServices(rows,cat)};$('#serviceSearch').addEventListener('input',()=>{page=1;redraw()});$('#serviceSort').addEventListener('change',()=>{page=1;redraw()});redraw()}
function renderServices(rows,context){const grid=$('#serviceGrid')||$('#directServices');if(!grid)return;const pages=Math.max(1,Math.ceil(rows.length/UI_PAGE_SIZE));if(page>pages)page=pages;const shown=rows.slice((page-1)*UI_PAGE_SIZE,page*UI_PAGE_SIZE);const count=$('#serviceCount');if(count)count.textContent=`${rows.length} serviço(s)`;grid.className='service-grid';grid.innerHTML=shown.length?shown.map(p=>{const im=mediaMap.get(p.id),href=safeHref(p)||'/#orcamento',desc=p.short_description||p.descricao||'Consulte opções e solicite seu orçamento.';return`<a class="service-card" href="${esc(href)}"><div class="media">${im?`<img src="${esc(im)}" alt="${esc(p.nome)}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:'<div class="croma-photo-missing" style="height:100%"></div>'}</div><div class="body"><h3>${esc(p.nome)}</h3><p>${esc(desc)}</p>${Number(p.preco)>0?`<div class="price">A partir de ${esc(money(p.preco))}</div>`:''}<span class="card-action">${safeHref(p)?'Ver detalhes':'Solicitar orçamento'} →</span></div></a>`}).join(''):'<div class="empty">Ainda não há serviços publicados nesta categoria.</div>';const pager=$('#servicePager');if(pager){pager.innerHTML=pages>1?`<button id="prevPage" ${page<=1?'disabled':''}>Anterior</button><span>Página ${page} de ${pages}</span><button id="nextPage" ${page>=pages?'disabled':''}>Próxima</button>`:'';$('#prevPage')?.addEventListener('click',()=>{if(page>1){page--;renderServices(rows,context)}});$('#nextPage')?.addEventListener('click',()=>{if(page<pages){page++;renderServices(rows,context)}})}}
try{const [cats,prods,medias]=await Promise.all([fetchAll(()=>supabase.from('catalog_categories').select('id,nome,slug,parent_id,ordem,catalog_scope,ativo,descricao,image_url,image_alt').eq('catalog_scope','servico').order('ordem').order('nome')),fetchAll(()=>supabase.from('products').select('id,nome,sku,slug,descricao,short_description,metadata,catalog_category_id,preco,ativo,product_type').eq('product_type','servico').eq('ativo',true).order('nome')),fetchAll(()=>supabase.from('product_media').select('product_id,url,is_primary,ordem,ativo,kind').eq('ativo',true).eq('kind','image').order('is_primary',{ascending:false}).order('ordem'))]);categories=cats;services=prods;for(const m of medias)if(m.product_id&&m.url&&!mediaMap.has(m.product_id))mediaMap.set(m.product_id,m.url);const root=categories.find(c=>c.slug==='servicos'&&!c.parent_id);if(!root)throw new Error('Estrutura de serviços não encontrada');if(!groupSlug){renderHome(root)}else{const group=categories.find(c=>c.slug===groupSlug&&c.parent_id===root.id&&c.ativo!==false&&MAIN_SLUGS.includes(c.slug));if(!group){renderHome(root)}else if(!categorySlug){renderGroup(group)}else{const cat=categories.find(c=>c.slug===categorySlug&&descendants(group.id).has(c.id)&&c.id!==group.id&&c.ativo!==false);if(cat)renderCategory(group,cat);else renderGroup(group)}}}catch(e){console.error('Falha ao carregar catálogo de serviços.',e);$('#catalogRoot').innerHTML='<p class="error">Não foi possível carregar os serviços agora. Tente novamente em instantes.</p>'}
</script>
</body>
</html>

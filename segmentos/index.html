<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soluções por segmento | Croma</title><link rel="stylesheet" href="/css/service-pages.css?v=20260831-5"><style>.shell{max-width:1320px}.intro{max-width:850px}.segment-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:30px}.segment-card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden}.segment-photo{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#eceaf3}.segment-body{padding:20px}.segment-card h2{margin:0 0 8px;color:var(--deep);font-size:1.28rem}.segment-card p{color:var(--muted);min-height:48px}.subsegments{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.subsegments span{border:1px solid var(--line);background:#f7f7fb;border-radius:999px;padding:7px 10px}.products{display:grid;gap:7px;margin-top:14px}.product-link{padding:9px 10px;border-radius:10px;background:#f6f5fb;font-weight:800;color:var(--deep)}.muted{color:var(--muted);font-size:.86rem}.error{padding:18px;border:1px dashed #e2bcbc;border-radius:14px;color:#a63838;background:#fff}@media(max-width:900px){.segment-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.segment-grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"></header><main class="shell"><div class="crumb"><a href="/">Início</a> › Soluções por segmento</div><div class="intro"><p class="eyebrow">Soluções por segmento</p><h1>Encontre o que a Croma pode fazer pelo seu negócio ou ocasião.</h1><p class="lead">Escolha seu segmento para encontrar produtos e serviços relacionados sem duplicar cadastros.</p></div><div class="segment-grid" id="segmentGrid"><p class="muted">Carregando segmentos...</p></div></main><script src="/js/service-header.js?v=20260831-5" defer></script><script type="module">import{supabase}from'/js/croma-supabase.js?v=20260831-1';const grid=document.querySelector('#segmentGrid');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const FALLBACK='https://images.pexels.com/photos/6368833/pexels-photo-6368833.jpeg?auto=compress&cs=tinysrgb&w=1200';try{const[s,p,l]=await Promise.all([supabase.from('catalog_segments').select('*').eq('ativo',true).order('home_order').order('nome'),supabase.from('products').select('id,nome,slug,metadata,product_type,ativo').eq('ativo',true),supabase.from('product_segments').select('*')]);if(s.error||p.error||l.error)throw s.error||p.error||l.error;const segs=s.data||[],products=p.data||[],links=l.data||[];const imageFor=r=>{let x=r,g=0;while(x&&g++<8){if(x.image_url)return{url:x.image_url,alt:x.image_alt||x.nome};x=segs.find(s=>s.id===x.parent_id)}return{url:FALLBACK,alt:r.nome}};const roots=segs.filter(x=>!x.parent_id);grid.innerHTML=roots.map(r=>{const children=segs.filter(x=>x.parent_id===r.id);const segmentIds=new Set([r.id,...children.map(x=>x.id)]);const productIds=new Set(links.filter(x=>segmentIds.has(x.segment_id)).map(x=>x.product_id));const ps=products.filter(x=>productIds.has(x.id)).slice(0,8),im=imageFor(r);return`<article class="segment-card"><img class="segment-photo" src="${esc(im.url)}" alt="${esc(im.alt)}" loading="lazy"><div class="segment-body"><h2>${esc(r.nome)}</h2><p>${esc(r.descricao||'')}</p>${children.length?`<div class="subsegments">${children.map(c=>`<span title="${esc(c.descricao||'')}">${esc(c.nome)}</span>`).join('')}</div>`:''}<div class="products">${ps.length?ps.map(x=>{const href=x.metadata?.href||(x.product_type==='servico'?`/servicos/${x.slug}/`:`/produtos/?q=${encodeURIComponent(x.nome)}`);return`<a class="product-link" href="${esc(href)}">${esc(x.nome)} →</a>`}).join(''):'<span class="muted">Nenhum item vinculado ainda.</span>'}</div></div></article>`}).join('')||'<p class="muted">Nenhum segmento ativo cadastrado.</p>'}catch(e){console.error(e);grid.innerHTML=`<p class="error">Não foi possível carregar os segmentos: ${esc(e.message||'erro desconhecido')}</p>`}</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soluções por segmento | Croma</title><link rel="stylesheet" href="/css/service-pages.css?v=20260831-3"><style>.shell{max-width:1320px}.intro{max-width:850px}.segment-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:30px}.segment-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}.segment-card h2{margin:8px 0;color:var(--deep);font-size:1.28rem}.segment-card p{color:var(--muted);min-height:48px}.segment-icon{font-size:2.2rem}.subsegments{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.subsegments button{border:1px solid var(--line);background:#f7f7fb;border-radius:999px;padding:7px 10px;cursor:pointer}.products{display:grid;gap:7px;margin-top:14px}.product-link{padding:9px 10px;border-radius:10px;background:#f6f5fb;font-weight:800;color:var(--deep)}.muted{color:var(--muted);font-size:.86rem}@media(max-width:900px){.segment-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.segment-grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"></header><main class="shell"><div class="crumb"><a href="/">Início</a> › Soluções por segmento</div><div class="intro"><p class="eyebrow">Soluções por segmento</p><h1>Encontre o que a Croma pode fazer pelo seu negócio ou ocasião.</h1><p class="lead">Um mesmo produto ou serviço pode atender vários públicos. Por isso, os segmentos funcionam como jornadas comerciais sem duplicar cadastros.</p></div><div class="segment-grid" id="segmentGrid"><p class="muted">Carregando segmentos...</p></div></main><script src="/js/service-header.js?v=20260831-4" defer></script><script type="module">import{supabase}from'/js/croma-supabase.js?v=20260831-1';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const[s,p,l]=await Promise.all([supabase.from('catalog_segments').select('*').eq('ativo',true).order('home_order'),supabase.from('products').select('id,nome,slug,metadata,product_type,ativo').eq('ativo',true),supabase.from('product_segments').select('*')]);if(s.error||p.error||l.error){segmentGrid.innerHTML='<p class="muted">Não foi possível carregar os segmentos.</p>'}else{const segs=s.data||[],products=p.data||[],links=l.data||[];const linked=id=>{const ids=new Set(links.filter(x=>x.segment_id===id).map(x=>x.product_id));return products.filter(x=>ids.has(x.id))};const roots=segs.filter(x=>!x.parent_id);segmentGrid.innerHTML=roots.map(r=>{const children=segs.filter(x=>x.parent_id===r.id);const allIds=new Set([r.id,...children.map(x=>x.id)]);const pids=new Set(links.filter(x=>allIds.has(x.segment_id)).map(x=>x.product_id));const ps=products.filter(x=>pids.has(x.id)).slice(0,6);return`<article class="segment-card"><div class="segment-icon">${esc(r.icon||'◆')}</div><h2>${esc(r.nome)}</h2><p>${esc(r.descricao||'')}</p>${children.length?`<div class="subsegments">${children.map(c=>`<button type="button" title="${esc(c.descricao||'')}">${esc(c.icon||'')} ${esc(c.nome)}</button>`).join('')}</div>`:''}<div class="products">${ps.length?ps.map(x=>{const href=x.metadata?.href||(x.product_type==='servico'?`/servicos/${x.slug}/`:`/produtos/?q=${encodeURIComponent(x.nome)}`);return`<a class="product-link" href="${esc(href)}">${esc(x.nome)} →</a>`}).join(''):'<span class="muted">Produtos e serviços serão vinculados a este segmento pelo painel interno.</span>'}</div></article>`}).join('')}};</script></body></html>

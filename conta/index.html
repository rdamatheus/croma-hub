<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Croma</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f5fb;color:#29263b}.wrap{max-width:520px;margin:70px auto;padding:24px}.card{background:#fff;border:1px solid #e8e6ef;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(33,28,92,.08)}h1{margin-top:0;color:#211c5c}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:6px;color:#30297F}.field input{width:100%;box-sizing:border-box;padding:12px 13px;border:1px solid #d9d6e6;border-radius:11px}.btn{width:100%;border:0;border-radius:12px;padding:13px 16px;background:#30297F;color:#fff;font-weight:900;cursor:pointer}.links{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:.9rem}.links a{color:#30297F;font-weight:800;text-decoration:none}.msg{margin-top:14px;font-size:.9rem;color:#a83a3a}.ok{color:#567d25}</style></head><body><main class="wrap"><section class="card"><a href="/" style="text-decoration:none;color:#30297F;font-weight:900">← Croma</a><h1>Entrar</h1><p>Acesse sua conta para anexar arquivos, finalizar pedidos e acompanhar seu histórico.</p><form id="loginForm"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required minlength="6"></div><button class="btn" type="submit">Entrar</button></form><div class="links"><a href="/cadastro/">Criar conta</a><a href="#" id="forgot">Esqueci minha senha</a></div><div id="msg" class="msg"></div></section></main><script type="module">import{supabase}from'/js/croma-supabase.js?v=20260821-2';const f=document.querySelector('#loginForm'),msg=document.querySelector('#msg'),next=new URLSearchParams(location.search).get('next')||'/';const show=(t,ok=false)=>{msg.textContent=t;msg.className=ok?'msg ok':'msg'};f.addEventListener('submit',async e=>{e.preventDefault();show('Entrando...',true);const{error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){show('Não foi possível entrar. Confira e-mail e senha.');return}location.href=next});forgot.addEventListener('click',async e=>{e.preventDefault();const mail=email.value.trim();if(!mail){show('Informe seu e-mail primeiro.');return}const{error}=await supabase.auth.resetPasswordForEmail(mail,{redirectTo:location.origin+'/conta/'});show(error?'Não foi possível enviar a recuperação.':'Enviamos as instruções para o seu e-mail.',!error)});const{data}=await supabase.auth.getSession();if(data.session?.user){show('Você já está conectado.',true)}</script></body></html>
